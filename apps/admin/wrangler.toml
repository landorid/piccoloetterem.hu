# The staff SPA, at admin.<domain>: an assets-only Worker serving the Vite build. The API is a
# separate Worker (apps/api, api.<domain>); see docs/STACK.md §1.
name = "piccolo-admin"
compatibility_date = "2026-09-01"

# The development Worker (deployed from `develop`). Cloudflare creates the DNS record and the
# certificate on deploy. The workers.dev URL stays on as well.
workers_dev = true
routes = [{ pattern = "admin-dev.piccoloetterem.hu", custom_domain = true }]

[assets]
directory = "./dist"
# Client-side routes such as /rendelesek get index.html, so a reload deep inside the SPA works.
not_found_handling = "single-page-application"

[env.staging]
name = "piccolo-admin-staging"
# `routes` is inherited: without this, staging would claim the development domain.
routes = []

[env.production]
name = "piccolo-admin-production"
routes = [{ pattern = "admin.piccoloetterem.hu", custom_domain = true }]
