# The API Worker, at api.<domain>. The public site (apps/web, <domain>) and the admin
# (apps/admin, admin.<domain>) are separate assets-only Workers; see docs/STACK.md §1.
name = "piccolo-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The confirmation e-mail's renderer (@react-email/render) imports prettier only for its `pretty`
# option, which the API never uses. Aliased to a stub, it costs nothing; bundled, it was 325 KiB of
# the upload. See src/email/prettier-stub.ts.
[alias]
"prettier/standalone" = "./src/email/prettier-stub.ts"
"prettier/plugins/html" = "./src/email/prettier-stub.ts"

# The top level is local development (`wrangler dev`, http://localhost:8787) and the development
# Worker that CI deploys from `develop` as `piccolo-api`.
[vars]
ENVIRONMENT = "development"
RESTAURANT = "piccolo"
# Browser origins allowed to call the API (CORS), comma-separated: the Astro and Vite dev servers
# that `pnpm dev` starts.
CORS_ORIGINS = "http://localhost:4321,http://localhost:5173,https://piccolo-web.honlapvarazslo.workers.dev,https://piccolo-admin.honlapvarazslo.workers.dev"
# Admin browser origins allowed to mint the Clerk session token (the azp claim).
# Exact origin, including scheme and port. The public site is not an authorized party.
# Empty is rejected by the API: Clerk skips the check when the list is empty.
CLERK_AUTHORIZED_PARTIES = "http://localhost:5173,https://piccolo-admin.honlapvarazslo.workers.dev"
# The confirmation e-mail is logged, not sent (src/email/ses.ts): the development database is shared
# and its orders carry made-up addresses, and SES is not set up for this Worker. Staging and
# production leave it unset and send through SES.
EMAIL_DRY_RUN = "1"

# The deployed development Worker's database. Locally `pnpm dev` (scripts/dev.mjs) hands wrangler
# DATABASE_URL from .dev.vars as CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "7578b36062614eb78fbb76c441014493" # piccolo-development (manual issue #40)

# The public menu cache (src/menu/cache.ts): entries never expire, the admin menu routes purge
# them. Locally `wrangler dev` uses Miniflare's KV instead of this namespace.
[[kv_namespaces]]
binding = "MENU_CACHE"
id = "810cc59518834d8ebb326b0f1fa6e3c8" # piccolo-menu-cache-development

# Secrets are never written in this file. Set them per environment with
#   wrangler secret put SENTRY_DSN --env <staging|production>
#   wrangler secret put CLERK_SECRET_KEY --env <staging|production>
#   wrangler secret put CLERK_PUBLISHABLE_KEY --env <staging|production>
#   wrangler secret put CLERK_JWT_KEY --env <staging|production>
#   wrangler secret put CLERK_ORG_ID --env <staging|production>
#   wrangler secret put SES_REGION --env <staging|production>
#   wrangler secret put SES_ACCESS_KEY_ID --env <staging|production>
#   wrangler secret put SES_SECRET_ACCESS_KEY --env <staging|production>
# Locally they live in .dev.vars. See README.md.

[env.staging]
name = "piccolo-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
RESTAURANT = "piccolo"
# Sends the confirmation e-mail through SES; needs the SES_* secrets (P1, #39).
EMAIL_DRY_RUN = "0"
# Placeholder. Replace with the staging web and admin Workers' URLs (manual issue #40).
CORS_ORIGINS = "https://piccolo-web-staging.<account>.workers.dev,https://piccolo-admin-staging.<account>.workers.dev"
# Placeholder. The admin origin only. Replace together with CORS_ORIGINS (manual issue #40).
CLERK_AUTHORIZED_PARTIES = "https://piccolo-admin-staging.<account>.workers.dev"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
# Placeholder. Replace with the id printed by `wrangler hyperdrive create piccolo-staging`
# for the staging Neon branch (manual issue #40).
id = "00000000000000000000000000000000"

[[env.staging.kv_namespaces]]
binding = "MENU_CACHE"
# Placeholder. Replace with the id printed by
# `wrangler kv namespace create piccolo-menu-cache-staging` (manual issue #40).
id = "22222222222222222222222222222222"

[env.production]
name = "piccolo-api-production"

[env.production.vars]
ENVIRONMENT = "production"
RESTAURANT = "piccolo"
# Sends the confirmation e-mail through SES; needs the SES_* secrets (P1, #39).
EMAIL_DRY_RUN = "0"
# Placeholder. Replace with the production web and admin URLs (manual issue #40); once the
# customer's domains are attached: https://<domain>,https://admin.<domain>.
CORS_ORIGINS = "https://piccolo-web-production.<account>.workers.dev,https://piccolo-admin-production.<account>.workers.dev"
# Placeholder. Once the customer's domain is attached: https://admin.<domain>.
CLERK_AUTHORIZED_PARTIES = "https://piccolo-admin-production.<account>.workers.dev"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
# Placeholder. Replace with the id printed by `wrangler hyperdrive create piccolo-production`
# for the production Neon branch (manual issue #40).
id = "11111111111111111111111111111111"

[[env.production.kv_namespaces]]
binding = "MENU_CACHE"
# Placeholder. Replace with the id printed by
# `wrangler kv namespace create piccolo-menu-cache-production` (manual issue #40).
id = "33333333333333333333333333333333"
