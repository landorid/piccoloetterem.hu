<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piccolo megrendelés mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      /* ==========================================================================
         O2 — design mockup of /megrendeles (issue #30)
         One file, no dependencies. The "app" markup is generated from the data and
         string tables below, so every state is the same components with different
         data — exactly what O6/O7 will build.
         The viewer chrome (top bar, device frames) is NOT part of the design.
         ========================================================================== */

      /* --- design tokens ----------------------------------------------------- */
      .app {
        /* colour */
        --brand-900: #33210f;
        --brand-800: #4a3018;
        --brand-700: #5f4222;
        --brand-600: #7a5230; /* primary — descended from the old site's #845c30 */
        --brand-500: #96693f;
        --brand-200: #e7d3ba;
        --brand-100: #f3e7d7;
        --brand-50: #faf4ec;

        --ink-900: #211c16;
        --ink-700: #4b4239;
        --ink-500: #7b7065;
        --ink-400: #8a7f72;

        --line: #e8dfd2;
        --line-strong: #d6c8b4;

        --paper: #ffffff;
        --ground: #faf6f0;

        --ok-700: #2c6e4a;
        --ok-100: #e3f1e8;
        --warn-700: #8a5300;
        --warn-100: #fdf0dc;
        --danger-700: #a3251d;
        --danger-100: #fbe8e5;

        /* type */
        --font-ui: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial,
          sans-serif;
        --font-display: 'Fraunces', ui-serif, Georgia, 'Times New Roman', serif;
        --t-xs: 0.75rem; /* 12 — allergen codes, badges */
        --t-sm: 0.8125rem; /* 13 — help text, meta */
        --t-md: 0.9375rem; /* 15 — dense lists */
        --t-base: 1rem; /* 16 — body, controls */
        --t-lg: 1.125rem; /* 18 — dish names, card titles */
        --t-xl: 1.25rem; /* 20 — screen titles on mobile */
        --t-2xl: 1.5rem; /* 24 — screen titles on desktop */
        --t-3xl: 1.875rem; /* 30 — success screen */

        /* spacing — 4px base */
        --s-1: 4px;
        --s-2: 8px;
        --s-3: 12px;
        --s-4: 16px;
        --s-5: 20px;
        --s-6: 24px;
        --s-8: 32px;
        --s-10: 40px;

        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 18px;
        --tap: 44px;

        --shadow-1: 0 1px 2px rgba(33, 28, 22, 0.05), 0 1px 3px rgba(33, 28, 22, 0.08);
        --shadow-2: 0 10px 30px rgba(33, 28, 22, 0.16);
        --shadow-bar: 0 -6px 18px rgba(33, 28, 22, 0.1);
      }

      /* --- viewer chrome ------------------------------------------------------ */
      :root {
        color-scheme: light;
        --v-bg: #201b16;
        --v-panel: #2c2620;
        --v-line: #453d34;
        --v-text: #f2ebe2;
        --v-dim: #b3a595;
        --v-accent: #e0b17a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--v-bg);
        color: var(--v-text);
        font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .viewer {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }
      .viewer-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
        padding: 10px 16px;
        background: var(--v-panel);
        border-bottom: 1px solid var(--v-line);
      }
      .viewer-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--v-accent);
        margin-right: auto;
      }
      .viewer-title small {
        display: block;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: none;
        font-weight: 500;
        color: var(--v-dim);
      }
      .viewer-bar label {
        font-size: 12px;
        color: var(--v-dim);
      }
      .viewer-bar select {
        font: inherit;
        font-size: 13px;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid var(--v-line);
        background: #1a1611;
        color: var(--v-text);
        max-width: 60vw;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--v-line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 12px;
        border: 0;
        background: #1a1611;
        color: var(--v-dim);
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: var(--v-accent);
        color: #201b16;
      }
      .viewer-bar button:focus-visible,
      .viewer-bar select:focus-visible {
        outline: 2px solid var(--v-accent);
        outline-offset: 2px;
      }
      .stage {
        padding: 20px 16px 64px;
        display: flex;
        flex-direction: column;
        gap: 28px;
        align-items: flex-start;
      }
      .state-note {
        max-width: 68ch;
        font-size: 14px;
        line-height: 1.55;
        color: var(--v-dim);
      }
      .state-note b {
        color: var(--v-text);
      }
      .devices {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        align-items: flex-start;
      }
      .device-slot {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .device-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--v-dim);
      }
      .device-box {
        width: calc(var(--w) * var(--s));
        height: calc(var(--h) * var(--s));
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--v-line);
        background: #fff;
      }
      .device {
        width: var(--w);
        height: var(--h);
        transform: scale(var(--s));
        transform-origin: top left;
        overflow-y: auto;
        overflow-x: hidden;
        container-type: inline-size;
        container-name: app;
        position: relative;
        background: var(--ground, #faf6f0);
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 24px;
        width: 100%;
      }
      .gallery-grid .device-slot {
        min-width: 0;
      }
      @media (max-width: 480px) {
        .stage {
          padding: 16px 0 48px;
        }
        .state-note {
          padding: 0 12px;
        }
        .gallery-grid {
          padding: 0 12px;
        }
      }

      /* ======================================================================
         THE DESIGN — everything below is the mockup itself
         ====================================================================== */
      .app {
        font-family: var(--font-ui);
        font-size: var(--t-base);
        line-height: 1.5;
        color: var(--ink-900);
        background: var(--ground);
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .app :is(h1, h2, h3, p, ul, ol) {
        margin: 0;
      }
      .app ul {
        padding: 0;
        list-style: none;
      }
      .app button {
        font: inherit;
        cursor: pointer;
      }
      .app :focus-visible {
        outline: 3px solid var(--brand-500);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }

      /* --- masthead ----------------------------------------------------------- */
      .masthead {
        position: sticky;
        top: 0;
        z-index: 6;
        background: var(--brand-800);
        color: #fff;
        height: 72px;
        padding: 0 var(--s-4);
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .masthead svg {
        height: 42px;
        width: auto;
        fill: currentColor;
        flex: none;
      }
      .masthead-meta {
        margin-left: auto;
        text-align: right;
        font-size: var(--t-xs);
        line-height: 1.35;
        color: var(--brand-200);
      }
      .masthead-meta a {
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        font-size: var(--t-sm);
      }

      /* --- week header + day rail --------------------------------------------- */
      .weekbar {
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: var(--s-4) var(--s-4) 0;
      }
      .weekbar h1 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: var(--t-xl);
        letter-spacing: -0.01em;
      }
      .weekbar .week-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--s-2) var(--s-3);
        margin-top: var(--s-1);
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .week-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--brand-100);
        color: var(--brand-700);
        font-weight: 600;
        font-size: var(--t-xs);
      }
      .daybar {
        position: sticky;
        top: 72px;
        z-index: 5;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .daybar::-webkit-scrollbar {
        display: none;
      }
      .daybar ul {
        display: flex;
        gap: var(--s-1);
        padding: var(--s-2) var(--s-4) 0;
        min-width: max-content;
      }
      .day {
        position: relative;
        min-width: 60px;
        min-height: var(--tap);
        padding: var(--s-2) var(--s-3) 10px;
        border: 0;
        background: none;
        border-bottom: 3px solid transparent;
        color: var(--ink-700);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      }
      .day .dow {
        font-size: var(--t-sm);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .day .dnum {
        font-size: var(--t-xs);
        color: var(--ink-500);
      }
      .day[aria-selected='true'] {
        color: var(--brand-700);
        border-bottom-color: var(--brand-600);
      }
      .day[aria-selected='true'] .dnum {
        color: var(--brand-600);
      }
      .day[disabled] {
        color: var(--ink-400);
        cursor: not-allowed;
      }
      .day[disabled] .dow {
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .day .dbadge {
        position: absolute;
        top: 2px;
        right: 4px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--brand-600);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
      }
      .day .dclosed {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-400);
      }

      /* --- layout ------------------------------------------------------------- */
      .screen {
        flex: 1;
        padding: var(--s-4) var(--s-4) 132px;
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
      }
      .rail {
        display: contents;
      }
      .col-main {
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
        min-width: 0;
      }

      /* --- cards and sections -------------------------------------------------- */
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-1);
      }
      .card > .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s-2);
        padding: var(--s-3) var(--s-4);
        border-bottom: 1px solid var(--line);
      }
      .card-head h2 {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
      }
      .card-head .count {
        margin-left: auto;
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .card-body {
        padding: var(--s-3) var(--s-4);
      }

      .section-h {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        margin-bottom: var(--s-2);
      }
      .section-h h2 {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .section-h .hint {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .eyebrow {
        font-size: var(--t-xs);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--brand-600);
      }

      /* --- dish list ----------------------------------------------------------- */
      /* Card language adapted from market.gasty.io: a leading tile, the whole row
         tappable, the price hard right. The tile carries a photo when there is one
         and the dish's initial when there is not — the layout does not change. */
      .dishes {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        overflow: hidden;
        box-shadow: var(--shadow-1);
      }
      .tile {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: var(--brand-50);
        border: 1px solid var(--brand-200);
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 500;
        color: var(--brand-500);
        overflow: hidden;
      }
      /* A choice that is not a dish ("Nem kérek"): an empty tile keeps the column
         and says "nothing here" rather than inventing an initial. */
      .tile-none {
        background: var(--ground);
        border-style: dashed;
        border-color: var(--line-strong);
      }
      .dish {
        display: flex;
        align-items: flex-start;
        gap: var(--s-3);
        width: 100%;
        min-height: 72px;
        padding: var(--s-3) var(--s-4);
        border: 0;
        border-top: 1px solid var(--line);
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .dish:first-child {
        border-top: 0;
      }
      button.dish:hover {
        background: var(--brand-50);
      }
      .dish-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .dish-name {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .dish-desc {
        font-size: var(--t-md);
        color: var(--ink-700);
      }
      .dish-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s-1) var(--s-2);
        margin-top: 2px;
      }
      .dish-price {
        flex: none;
        max-width: 92px;
        text-align: right;
        font-weight: 700;
        white-space: nowrap;
      }
      .dish-price .weekend {
        display: block;
        font-size: var(--t-xs);
        font-weight: 500;
        line-height: 1.3;
        color: var(--ink-500);
        white-space: normal;
      }
      .dish-price .included {
        display: block;
        margin-top: 2px;
        font-size: var(--t-xs);
        font-weight: 600;
        line-height: 1.25;
        color: var(--ok-700);
        white-space: normal;
      }
      .dish.is-soldout .dish-name,
      .dish.is-soldout .dish-desc,
      .dish.is-soldout .dish-price {
        color: var(--ink-500);
      }
      .dish.is-soldout .dish-name {
        text-decoration: line-through;
        text-decoration-color: var(--line-strong);
      }
      .dish.is-soldout .tile {
        opacity: 0.55;
      }

      /* Horizontal rails for the secondary, repeat-every-week sections. The daily
         soups and mains stay a vertical list: hiding today's mains behind a swipe
         is exactly the wrong trade at 07:40. */
      .rail-scroll {
        display: flex;
        gap: var(--s-3);
        overflow-x: auto;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
        margin-inline: calc(var(--s-4) * -1);
        padding: 2px var(--s-4) var(--s-2);
      }
      .rail-scroll::-webkit-scrollbar {
        display: none;
      }
      .rail-card {
        flex: none;
        width: 150px;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        gap: var(--s-1);
        padding: var(--s-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: var(--shadow-1);
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .rail-card .tile {
        width: 100%;
        height: 76px;
        font-size: 28px;
      }
      .rail-card .rc-price {
        font-weight: 700;
        font-size: var(--t-md);
      }
      .rail-card .rc-name {
        font-family: var(--font-display);
        font-size: var(--t-md);
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .rail-card .rc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .rail-card.is-soldout .rc-name,
      .rail-card.is-soldout .rc-price {
        color: var(--ink-500);
        text-decoration: line-through;
        text-decoration-color: var(--line-strong);
      }

      /* Category chips — jump to a section without scrolling past everything. */
      .chiprail {
        position: sticky;
        top: 141px;
        z-index: 4;
        margin-inline: calc(var(--s-4) * -1);
        padding: var(--s-2) 0;
        background: var(--ground);
        border-bottom: 1px solid var(--line);
      }
      .chiprail-scroll {
        display: flex;
        gap: var(--s-2);
        overflow-x: auto;
        scrollbar-width: none;
        padding-inline: var(--s-4);
      }
      .chiprail-scroll::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        min-height: 38px;
        padding: 0 var(--s-4);
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--paper);
        font-size: var(--t-md);
        font-weight: 600;
        color: var(--ink-700);
        white-space: nowrap;
      }
      .chip[aria-pressed='true'] {
        background: var(--brand-800);
        border-color: var(--brand-800);
        color: #fff;
      }
      section[data-sec] {
        scroll-margin-top: 196px;
      }

      /* --- small parts --------------------------------------------------------- */
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: var(--t-xs);
        font-weight: 700;
        letter-spacing: 0.02em;
        border: 1px solid transparent;
      }
      .tag-soldout {
        background: var(--danger-100);
        color: var(--danger-700);
      }
      .tag-choice {
        background: var(--brand-100);
        color: var(--brand-700);
      }
      .tag-new {
        background: var(--ok-100);
        color: var(--ok-700);
      }
      /* Allergens — a pictogram per allergen, adapted from market.gasty.io. The glyph
         is what a guest with an allergy scans for; the number only ties the row back
         to the numbered legend, so it lives in the bubble and in the sheet instead of
         on a 28 px disc. One tint, not fourteen — see decision 10 in the README. */
      .achips {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
      }
      /* Two elements per chip on purpose: the outer one is the target (32 × 44, the
         negative margin gives the extra height back to the line so no row grows),
         the inner one is the 28 px disc that is painted and that the focus ring
         follows — an outline around the 44 px box would read as a stray rectangle. */
      .achip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 32px;
        height: var(--tap);
        margin: -8px -2px;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
      }
      .achip .adisc {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--brand-100);
        color: var(--brand-700);
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .achip .adisc svg {
        width: 20px;
        height: 20px;
        display: block;
      }
      .achip:hover .adisc,
      .achip[data-tipopen] .adisc {
        background: var(--brand-200);
        color: var(--brand-800);
      }
      .achip:focus-visible {
        outline: none;
      }
      .achip:focus-visible .adisc {
        outline: 3px solid var(--brand-500);
        outline-offset: 2px;
      }
      .is-soldout .achip .adisc {
        opacity: 0.55;
      }

      /* The bubble that names the allergen. It cannot live next to its chip: .dishes,
         .rail-scroll and the sheet body all clip their overflow. So there is exactly
         one per app, position: fixed — and inside a device frame, which carries both a
         transform and container-type, "fixed" resolves against the frame itself. That
         is the box we want it kept inside, and it is the same trick .overlay uses.
         z-index sits above the sheet (20) so a chip inside the composer works too. */
      .atip {
        position: fixed;
        z-index: 30;
        max-width: 236px;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        background: var(--brand-800);
        color: #fff;
        font-size: var(--t-sm);
        font-weight: 600;
        line-height: 1.35;
        box-shadow: var(--shadow-2);
        pointer-events: none;
        opacity: 0;
        transition: opacity 90ms ease-out;
      }
      .atip[hidden] {
        display: none;
      }
      .atip.is-open {
        opacity: 1;
      }
      .atip::after {
        content: '';
        position: absolute;
        top: 100%;
        left: var(--ax, 50%);
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: var(--brand-800);
      }
      .atip.is-below::after {
        top: auto;
        bottom: 100%;
        border-top-color: transparent;
        border-bottom-color: var(--brand-800);
      }

      /* The legend in the sheet: the same disc next to the number and the name, so the
         two representations teach each other. */
      .alist {
        display: flex;
        flex-direction: column;
      }
      .alist-row {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        min-height: var(--tap);
        padding: var(--s-1) 0;
        border-top: 1px solid var(--line);
        font-size: var(--t-md);
      }
      .alist-row:first-child {
        border-top: 0;
      }
      .alist-row .achip {
        margin: 0;
      }
      .alist-row .num {
        flex: none;
        width: 20px;
        text-align: right;
        color: var(--ink-500);
        font-size: var(--t-sm);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .alist-row .what {
        flex: 1;
        min-width: 0;
      }
      .allergen-note {
        display: flex;
        gap: var(--s-2);
        padding: var(--s-3);
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        background: var(--brand-50);
        font-size: var(--t-sm);
        color: var(--ink-700);
        line-height: 1.5;
      }
      .allergen-note button {
        border: 0;
        background: none;
        padding: 0;
        color: var(--brand-700);
        font-weight: 700;
        text-decoration: underline;
      }

      /* --- buttons ------------------------------------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--s-2);
        min-height: var(--tap);
        padding: 0 var(--s-4);
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font-weight: 700;
        font-size: var(--t-base);
        text-decoration: none;
      }
      .btn-primary {
        background: var(--brand-600);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--brand-700);
      }
      .btn-secondary {
        background: var(--paper);
        color: var(--brand-700);
        border-color: var(--brand-200);
      }
      .btn-ghost {
        background: none;
        color: var(--ink-700);
        border-color: var(--line-strong);
      }
      .btn-quiet {
        background: none;
        border: 0;
        color: var(--brand-700);
        font-weight: 700;
        min-height: 36px;
        padding: 0 var(--s-1);
        text-decoration: underline;
      }
      .btn-danger {
        background: none;
        border: 0;
        color: var(--danger-700);
        font-weight: 600;
        min-height: 36px;
        padding: 0 var(--s-1);
      }
      .btn-sm {
        min-height: 36px;
        padding: 0 var(--s-3);
        font-size: var(--t-md);
      }
      .btn-block {
        width: 100%;
      }
      .btn[disabled],
      .btn[aria-disabled='true'] {
        background: var(--line);
        color: var(--ink-400);
        border-color: transparent;
        cursor: not-allowed;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-top-color: transparent;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }

      /* --- banners ------------------------------------------------------------- */
      .banner {
        display: flex;
        gap: var(--s-3);
        padding: var(--s-3) var(--s-4);
        border-radius: var(--radius);
        border: 1px solid;
        font-size: var(--t-md);
        line-height: 1.5;
      }
      .banner h3 {
        font-size: var(--t-base);
        font-weight: 700;
        margin-bottom: 2px;
      }
      .banner .icon {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        margin-top: 1px;
      }
      .banner-info {
        background: var(--brand-50);
        border-color: var(--brand-200);
        color: var(--ink-700);
      }
      .banner-info .icon {
        background: var(--brand-600);
      }
      .banner-warn {
        background: var(--warn-100);
        border-color: #eccb96;
        color: #6b4200;
      }
      .banner-warn .icon {
        background: var(--warn-700);
      }
      .banner-danger {
        background: var(--danger-100);
        border-color: #eeb7b1;
        color: #7d1c16;
      }
      .banner-danger .icon {
        background: var(--danger-700);
      }
      .banner-ok {
        background: var(--ok-100);
        border-color: #b6dcc4;
        color: #1f5537;
      }
      .banner-ok .icon {
        background: var(--ok-700);
      }
      .banner ul {
        margin-top: var(--s-2);
        display: flex;
        flex-direction: column;
        gap: var(--s-1);
        font-size: var(--t-md);
      }
      .banner li::before {
        content: '— ';
      }

      /* --- the day's order (cart) ---------------------------------------------- */
      .cart-menu {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--s-1) var(--s-3);
        padding: var(--s-3) var(--s-4);
        border-top: 1px solid var(--line);
      }
      .cart-menu:first-of-type {
        border-top: 0;
      }
      .cart-who {
        font-weight: 700;
        font-size: var(--t-base);
      }
      .cart-lines {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--t-md);
        color: var(--ink-700);
      }
      .cart-line {
        display: flex;
        gap: var(--s-3);
      }
      .cart-line .slot {
        flex: none;
        width: 84px;
        color: var(--ink-500);
        font-size: var(--t-sm);
        padding-top: 1px;
      }
      .cart-line .what {
        flex: 1;
        min-width: 0;
      }
      .cart-line .amt {
        flex: none;
        margin-left: auto;
        white-space: nowrap;
      }
      .cart-line.adj .what {
        color: var(--brand-700);
        font-weight: 600;
      }
      .cart-line.adj .amt {
        color: var(--brand-700);
        font-weight: 700;
      }
      .cart-menu-total {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: var(--s-3);
        margin-top: var(--s-2);
        padding-top: var(--s-2);
        border-top: 1px dashed var(--line-strong);
        font-weight: 700;
      }
      .cart-menu-total .amt {
        flex: none;
        margin-left: auto;
      }
      .cart-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: var(--s-4);
        margin-top: var(--s-1);
      }
      .cart-empty {
        padding: var(--s-4);
        color: var(--ink-500);
        font-size: var(--t-md);
      }

      .extras {
        border-top: 1px solid var(--line);
        padding: var(--s-3) var(--s-4);
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .extra {
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .extra .name {
        flex: 1;
        min-width: 0;
        font-size: var(--t-md);
      }
      .extra .name small {
        display: block;
        color: var(--ink-500);
        font-size: var(--t-sm);
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
      }
      .stepper button {
        width: var(--tap);
        height: 36px;
        border: 0;
        background: none;
        font-size: 18px;
        font-weight: 700;
        color: var(--brand-700);
        border-radius: 999px;
      }
      .stepper button[disabled] {
        color: var(--ink-400);
        cursor: not-allowed;
      }
      .stepper .qty {
        min-width: 26px;
        text-align: center;
        font-weight: 700;
      }
      .extra .amt {
        flex: none;
        width: 68px;
        text-align: right;
        font-weight: 600;
        font-size: var(--t-md);
      }
      /* The same row in the offer list, in the dish list's card so the extras
         section sits in the same column as every other section. No leading tile:
         two of the three extras start with the same letter, and on a 375 px phone
         the stepper needs those 60 px more than the row needs a square. */
      .extra-list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        overflow: hidden;
        box-shadow: var(--shadow-1);
      }
      .extra-list .extra {
        min-height: 64px;
        padding: var(--s-3) var(--s-4);
        border-top: 1px solid var(--line);
      }
      .extra-list .extra:first-child {
        border-top: 0;
      }
      .extra-list .extra .name {
        font-size: var(--t-base);
      }
      .extra-list .extra.is-on {
        background: var(--brand-50);
      }

      /* --- overlays: composer, pickers, sheets ---------------------------------- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(33, 28, 22, 0.5);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        background: var(--ground);
        width: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        box-shadow: var(--shadow-2);
        overflow: hidden;
      }
      .sheet-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s-3);
        padding: var(--s-3) var(--s-4);
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .sheet-head .titles {
        min-width: 0;
      }
      .sheet-head h2 {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
      }
      .sheet-head .sub {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .sheet-close {
        margin-left: auto;
        width: var(--tap);
        height: var(--tap);
        border: 0;
        border-radius: 50%;
        background: var(--brand-50);
        color: var(--brand-700);
        font-size: 20px;
        line-height: 1;
        flex: none;
      }
      .composer-form {
        display: flex;
        flex-direction: column;
        background: var(--ground);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-1);
        scroll-margin-top: 150px;
      }
      .cf-head {
        padding: var(--s-3) var(--s-4);
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .cf-head h2 {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
      }
      .cf-head .hint {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .cf-body {
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
        padding: var(--s-4);
      }
      .cf-foot {
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
        padding: var(--s-3) var(--s-4) var(--s-4);
        background: var(--paper);
        border-top: 1px solid var(--line);
      }
      .extra-note {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .sheet-body {
        flex: 1;
        overflow-y: auto;
        padding: var(--s-4);
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
      }
      .sheet-body > * {
        flex: none;
      }
      .sheet-foot {
        padding: var(--s-3) var(--s-4);
        background: var(--paper);
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
        box-shadow: var(--shadow-bar);
      }

      .slots {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .slot-row {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        width: 100%;
        min-height: 56px;
        padding: var(--s-2) var(--s-4);
        border: 0;
        border-top: 1px solid var(--line);
        background: none;
        text-align: left;
      }
      .slot-row:first-child {
        border-top: 0;
      }
      .slot-row .label {
        flex: none;
        width: 84px;
        font-size: var(--t-sm);
        font-weight: 700;
        color: var(--ink-500);
        letter-spacing: 0.02em;
      }
      .slot-row .value {
        flex: 1;
        min-width: 0;
      }
      .slot-row .value .picked {
        font-family: var(--font-display);
        font-size: var(--t-base);
        font-weight: 500;
      }
      .slot-row .value .placeholder {
        color: var(--ink-500);
      }
      .slot-row .value .sub {
        display: block;
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .slot-row .amt {
        font-weight: 600;
        font-size: var(--t-md);
        white-space: nowrap;
      }
      .slot-row .chev {
        color: var(--ink-400);
        font-size: 18px;
        flex: none;
      }
      .slot-row.is-required {
        background: var(--danger-100);
      }
      .slot-row.is-required .label {
        color: var(--danger-700);
      }
      .slot-req {
        display: block;
        font-size: var(--t-sm);
        font-weight: 700;
        color: var(--danger-700);
      }

      .options {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      /* --- pick rows ------------------------------------------------------------
         One anatomy for choosing a dish, taken from the reference item sheet: a 48px
         tile, the name with its price effect under it, and a 28px mark on the right
         that fills with the accent and a ✓ when chosen. Two chromes on the same row:
         .choicerow — a separated, hairline card, used inline in the composer;
         .option    — a joined list row inside .options, used by the main-course picker,
                      which has 11 items in three labelled groups and so wants a list.
         The whole row is the target and it is never shorter than --tap. */
      .pickrow {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        width: 100%;
        min-height: var(--tap);
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .pickrow .pbody {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .pickrow .pname {
        font-family: var(--font-display);
        font-size: var(--t-base);
        font-weight: 500;
        line-height: 1.25;
      }
      .pickrow .pamt {
        font-size: var(--t-sm);
        font-weight: 600;
        color: var(--ink-500);
      }
      .pickrow[aria-checked='true'] .pamt {
        color: var(--brand-700);
      }
      .pickrow .psub {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--s-1) var(--s-2);
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .pickrow[aria-disabled='true'] {
        cursor: not-allowed;
      }
      .pickrow[aria-disabled='true'] .pname,
      .pickrow[aria-disabled='true'] .pamt {
        color: var(--ink-500);
        text-decoration: line-through;
        text-decoration-color: var(--line-strong);
      }
      .pickrow[aria-disabled='true'] .tile {
        opacity: 0.55;
      }
      .pickrow .pmark {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid var(--line-strong);
        background: var(--paper);
        color: transparent;
      }
      .pickrow[aria-checked='true'] .pmark {
        display: grid;
        place-items: center;
        border-color: var(--brand-600);
        background: var(--brand-600);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }

      .option {
        padding: var(--s-2) var(--s-4);
        border-top: 1px solid var(--line);
      }
      .option:first-child {
        border-top: 0;
      }
      .option[aria-checked='true'] {
        background: var(--brand-50);
      }
      button.option:not([aria-checked='true']):not([disabled]):hover {
        background: var(--brand-50);
      }

      /* The option list stacks in full — no inner scroller. The sheet body already
         scrolls, and a scroller inside it would hide the side options that are the
         usual reason the add button is disabled. */
      .choicerows {
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .choicerow {
        padding: var(--s-2) var(--s-3);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
      }
      .choicerow[aria-checked='true'] {
        border-color: var(--brand-600);
        background: var(--brand-50);
      }
      button.choicerow:not([aria-checked='true']):not([disabled]):hover {
        background: var(--brand-50);
      }
      .field-label {
        font-size: var(--t-xs);
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-500);
        margin-bottom: var(--s-2);
      }
      .field-label.is-required {
        color: var(--danger-700);
      }

      .foot-top {
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .foot-price {
        font-family: var(--font-display);
        font-size: var(--t-2xl);
        font-weight: 600;
        line-height: 1.1;
      }
      .foot-price small {
        display: block;
        font-family: var(--font-ui);
        font-size: var(--t-xs);
        font-weight: 600;
        color: var(--ink-500);
      }
      .foot-top .stepper {
        margin-left: auto;
      }
      .foot-actions {
        display: flex;
        gap: var(--s-2);
      }
      .foot-actions .btn {
        flex: 1;
      }
      .foot-actions .btn-ghost {
        flex: 0 0 36%;
      }

      .pricebox {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: var(--s-3) var(--s-4);
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--t-md);
      }
      .pricebox .row {
        display: flex;
        gap: var(--s-3);
      }
      .pricebox .row .amt {
        flex: none;
        margin-left: auto;
        white-space: nowrap;
      }
      .pricebox .row.adj {
        color: var(--brand-700);
        font-weight: 600;
      }
      .pricebox .row.total {
        margin-top: var(--s-2);
        padding-top: var(--s-2);
        border-top: 1px dashed var(--line-strong);
        font-size: var(--t-base);
        font-weight: 700;
      }
      .pricebox .why {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }

      /* --- forms ---------------------------------------------------------------- */
      .fields {
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
      }
      .field label {
        display: block;
        font-size: var(--t-md);
        font-weight: 700;
        margin-bottom: var(--s-1);
      }
      .field .req {
        color: var(--danger-700);
      }
      .field .control {
        width: 100%;
        min-height: var(--tap);
        padding: 10px var(--s-3);
        font: inherit;
        color: var(--ink-900);
        background: var(--paper);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
      }
      .field textarea.control {
        min-height: 88px;
        resize: vertical;
      }
      .field .control::placeholder {
        color: var(--ink-500);
      }
      .field .help {
        margin-top: var(--s-1);
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .field.has-error .control {
        border-color: var(--danger-700);
        background: var(--danger-100);
      }
      .sheet-foot .error {
        font-size: var(--t-sm);
        font-weight: 600;
        color: var(--danger-700);
      }
      .week-terms {
        margin-top: var(--s-2);
        padding: var(--s-2) 0 var(--s-3);
        font-size: var(--t-sm);
        font-weight: 600;
        color: var(--brand-700);
      }
      .field .error {
        margin-top: var(--s-1);
        font-size: var(--t-sm);
        font-weight: 600;
        color: var(--danger-700);
      }

      /* --- totals + sticky summary ---------------------------------------------- */
      .totals {
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .totals .day-block {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--t-md);
      }
      .totals .day-block .dh {
        font-weight: 700;
        font-size: var(--t-base);

       * 4. PRICING — mirrors the rules in PLAN.md §2. In the real app this
       *    lives in packages/core (issue O1); here it exists so every price
       *    shown in the mockup is derived, never typed in by hand.
       * ------------------------------------------------------------------ */
      const isWeekend = (date) => dayOf(date).dow === 6;
      const priceOf = (item, date) =>
        !item ? 0 : isWeekend(date) ? item.priceWeekend : item.priceWeekday;
      const dayOf = (date) => DAYS.find((d) => d.date === date);

      /** @returns {{lines: Array, total: number, errors: string[]}} */
      function priceMenu(m, date) {
        const lines = [];
        const errors = [];
        const soupItem = m.soup ? ITEMS[m.soup] : null;
        const mainItem = m.main ? ITEMS[m.main] : null;
        const includesSoup = !!(mainItem && mainItem.soupIncluded);

        if (soupItem) {
          lines.push({
            slot: S.composer.slots.soup,
            what: soupItem.name,
            amount: 0,
            note: includesSoup ? S.dish.soupIncluded : null,
          });
        }
        if (mainItem) {
          lines.push({
            slot: S.composer.slots.main,
            what: mainItem.name + (m.variation ? ' — ' + m.variation : ''),
            amount: priceOf(mainItem, date),
          });
        }
        if (mainItem && !soupItem && includesSoup) {
          lines.push({
            adj: true,
            what: S.composer.noSoupDiscount,
            amount: -CFG.pricing.noSoupDiscount,
          });
        }
        if (soupItem && !includesSoup) {
          lines.push({
            adj: true,
            what: S.composer.soupSurcharge,
            amount: CFG.pricing.soupPrice,
            why: S.composer.soupSurchargeWhy,
          });
        }
        for (const slot of ['side', 'pickle', 'dessert']) {
          const it = m[slot] ? ITEMS[m[slot]] : null;
          if (it) {
            lines.push({ slot: S.composer.slots[slot], what: it.name, amount: priceOf(it, date) });
          }
        }

        if (mainItem && mainItem.variations && !m.variation) errors.push('variation');
        if (mainItem && mainItem.requiresSide && !m.side) errors.push('side');
        if (!soupItem && !mainItem && !m.side && !m.pickle && !m.dessert) errors.push('empty');

        return { lines, total: lines.reduce((s, l) => s + l.amount, 0), errors };
      }

      /** Per delivery day: food subtotal (extras included), fee, total, minimum check. */
      function priceDay(day) {
        const menus = day.menus.map((m) => ({ menu: m, price: priceMenu(m, day.date) }));
        const extras = (day.extras || [])
          .filter((e) => e.qty > 0)
          .map((e) => {
            const cfg = CFG.extras.find((x) => x.key === e.key);
            return { ...cfg, qty: e.qty, amount: cfg.price * e.qty };
          });
        const food =
          menus.reduce((s, m) => s + m.price.total, 0) + extras.reduce((s, e) => s + e.amount, 0);
        const fee = CFG.pricing.deliveryFee;
        return {
          date: day.date,
          menus,
          extras,
          food,
          fee,
          total: food + fee,
          missing: Math.max(0, CFG.pricing.minimumOrder - food),
        };
      }

        const days = cart.map(priceDay);

          grand: days.reduce((s, d) => s + d.total, 0),
          belowMinimum: days.filter((d) => d.missing > 0),
