<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piccolo rendelés — mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      /* ==========================================================================
         O2 — design mockup of /megrendeles (issue #30)
         One file, no dependencies. The "app" markup is generated from the data and
         string tables below, so every state is the same components with different
         data — exactly what O6/O7 will build.
         The viewer chrome (top bar, device frames) is NOT part of the design.
         ========================================================================== */

      /* --- design tokens ----------------------------------------------------- */
      .app {
        /* colour */
        --brand-900: #33210f;
        --brand-800: #4a3018;
        --brand-700: #5f4222;
        --brand-600: #7a5230; /* primary — descended from the old site's #845c30 */
        --brand-500: #96693f;
        --brand-200: #e7d3ba;
        --brand-100: #f3e7d7;
        --brand-50: #faf4ec;

        --ink-900: #211c16;
        --ink-700: #4b4239;
        --ink-500: #7b7065;
        --ink-400: #8a7f72;

        --line: #e8dfd2;
        --line-strong: #d6c8b4;

        --paper: #ffffff;
        --ground: #faf6f0;

        --ok-700: #2c6e4a;
        --ok-100: #e3f1e8;
        --warn-700: #8a5300;
        --warn-100: #fdf0dc;
        --danger-700: #a3251d;
        --danger-100: #fbe8e5;

        /* type */
        --font-ui: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial,
          sans-serif;
        --font-display: 'Fraunces', ui-serif, Georgia, 'Times New Roman', serif;
        --t-xs: 0.75rem; /* 12 — allergen codes, badges */
        --t-sm: 0.8125rem; /* 13 — help text, meta */
        --t-md: 0.9375rem; /* 15 — dense lists */
        --t-base: 1rem; /* 16 — body, controls */
        --t-lg: 1.125rem; /* 18 — dish names, card titles */
        --t-xl: 1.25rem; /* 20 — screen titles on mobile */
        --t-2xl: 1.5rem; /* 24 — screen titles on desktop */
        --t-3xl: 1.875rem; /* 30 — success screen */

        /* spacing — 4px base */
        --s-1: 4px;
        --s-2: 8px;
        --s-3: 12px;
        --s-4: 16px;
        --s-5: 20px;
        --s-6: 24px;
        --s-8: 32px;
        --s-10: 40px;

        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 18px;
        --tap: 44px;

        --shadow-1: 0 1px 2px rgba(33, 28, 22, 0.05), 0 1px 3px rgba(33, 28, 22, 0.08);
        --shadow-2: 0 10px 30px rgba(33, 28, 22, 0.16);
        --shadow-bar: 0 -6px 18px rgba(33, 28, 22, 0.1);
      }

      /* --- viewer chrome ------------------------------------------------------ */
      :root {
        color-scheme: light;
        --v-bg: #201b16;
        --v-panel: #2c2620;
        --v-line: #453d34;
        --v-text: #f2ebe2;
        --v-dim: #b3a595;
        --v-accent: #e0b17a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--v-bg);
        color: var(--v-text);
        font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .viewer {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }
      .viewer-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
        padding: 10px 16px;
        background: var(--v-panel);
        border-bottom: 1px solid var(--v-line);
      }
      .viewer-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--v-accent);
        margin-right: auto;
      }
      .viewer-title small {
        display: block;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: none;
        font-weight: 500;
        color: var(--v-dim);
      }
      .viewer-bar label {
        font-size: 12px;
        color: var(--v-dim);
      }
      .viewer-bar select {
        font: inherit;
        font-size: 13px;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid var(--v-line);
        background: #1a1611;
        color: var(--v-text);
        max-width: 60vw;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--v-line);
        border-radius: 8px;
        overflow: hidden;
      }
      .seg button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 12px;
        border: 0;
        background: #1a1611;
        color: var(--v-dim);
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        background: var(--v-accent);
        color: #201b16;
      }
      .viewer-bar button:focus-visible,
      .viewer-bar select:focus-visible {
        outline: 2px solid var(--v-accent);
        outline-offset: 2px;
      }
      .stage {
        padding: 20px 16px 64px;
        display: flex;
        flex-direction: column;
        gap: 28px;
        align-items: flex-start;
      }
      .state-note {
        max-width: 68ch;
        font-size: 14px;
        line-height: 1.55;
        color: var(--v-dim);
      }
      .state-note b {
        color: var(--v-text);
      }
      .devices {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        align-items: flex-start;
      }
      .device-slot {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .device-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--v-dim);
      }
      .device-box {
        width: calc(var(--w) * var(--s));
        height: calc(var(--h) * var(--s));
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--v-line);
        background: #fff;
      }
      .device {
        width: var(--w);
        height: var(--h);
        transform: scale(var(--s));
        transform-origin: top left;
        overflow-y: auto;
        overflow-x: hidden;
        container-type: inline-size;
        container-name: app;
        position: relative;
        background: var(--ground, #faf6f0);
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 24px;
        width: 100%;
      }
      .gallery-grid .device-slot {
        min-width: 0;
      }

      /* ======================================================================
         THE DESIGN — everything below is the mockup itself
         ====================================================================== */
      .app {
        font-family: var(--font-ui);
        font-size: var(--t-base);
        line-height: 1.5;
        color: var(--ink-900);
        background: var(--ground);
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .app :is(h1, h2, h3, p, ul, ol) {
        margin: 0;
      }
      .app ul {
        padding: 0;
        list-style: none;
      }
      .app button {
        font: inherit;
        cursor: pointer;
      }
      .app :focus-visible {
        outline: 3px solid var(--brand-500);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
      .num {
        font-variant-numeric: tabular-nums;
      }

      /* --- masthead ----------------------------------------------------------- */
      .masthead {
        position: sticky;
        top: 0;
        z-index: 6;
        background: var(--brand-800);
        color: #fff;
        padding: var(--s-3) var(--s-4);
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .masthead svg {
        width: 104px;
        height: auto;
        fill: currentColor;
        flex: none;
      }
      .masthead-meta {
        margin-left: auto;
        text-align: right;
        font-size: var(--t-xs);
        line-height: 1.35;
        color: var(--brand-200);
      }
      .masthead-meta a {
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        font-size: var(--t-sm);
      }

      /* --- week header + day rail --------------------------------------------- */
      .weekbar {
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: var(--s-4) var(--s-4) 0;
      }
      .weekbar h1 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: var(--t-xl);
        letter-spacing: -0.01em;
      }
      .weekbar .week-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--s-2) var(--s-3);
        margin-top: var(--s-1);
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .week-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--brand-100);
        color: var(--brand-700);
        font-weight: 600;
        font-size: var(--t-xs);
      }
      .daybar {
        position: sticky;
        top: 52px;
        z-index: 5;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .daybar::-webkit-scrollbar {
        display: none;
      }
      .daybar ul {
        display: flex;
        gap: var(--s-1);
        padding: var(--s-2) var(--s-4) 0;
        min-width: max-content;
      }
      .day {
        position: relative;
        min-width: 60px;
        min-height: var(--tap);
        padding: var(--s-2) var(--s-3) 10px;
        border: 0;
        background: none;
        border-bottom: 3px solid transparent;
        color: var(--ink-700);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      }
      .day .dow {
        font-size: var(--t-sm);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .day .dnum {
        font-size: var(--t-xs);
        color: var(--ink-500);
      }
      .day[aria-selected='true'] {
        color: var(--brand-700);
        border-bottom-color: var(--brand-600);
      }
      .day[aria-selected='true'] .dnum {
        color: var(--brand-600);
      }
      .day[disabled] {
        color: var(--ink-400);
        cursor: not-allowed;
      }
      .day[disabled] .dow {
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .day .dbadge {
        position: absolute;
        top: 2px;
        right: 4px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--brand-600);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
      }
      .day .dclosed {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-400);
      }

      /* --- layout ------------------------------------------------------------- */
      .screen {
        flex: 1;
        padding: var(--s-4) var(--s-4) 132px;
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
      }
      .rail {
        display: contents;
      }
      .col-main {
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
        min-width: 0;
      }

      /* --- cards and sections -------------------------------------------------- */
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-1);
      }
      .card > .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s-2);
        padding: var(--s-3) var(--s-4);
        border-bottom: 1px solid var(--line);
      }
      .card-head h2 {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
      }
      .card-head .count {
        margin-left: auto;
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .card-body {
        padding: var(--s-3) var(--s-4);
      }

      .section-h {
        display: flex;
        align-items: baseline;
        gap: var(--s-2);
        margin-bottom: var(--s-2);
      }
      .section-h h2 {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .section-h .hint {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .eyebrow {
        font-size: var(--t-xs);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--brand-600);
      }

      /* --- dish list ----------------------------------------------------------- */
      .dishes {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        overflow: hidden;
        box-shadow: var(--shadow-1);
      }
      .dish {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--s-1) var(--s-3);
        padding: var(--s-3) var(--s-4);
        border-top: 1px solid var(--line);
        align-items: start;
      }
      .dish:first-child {
        border-top: 0;
      }
      .dish-name {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      .dish-desc {
        grid-column: 1;
        font-size: var(--t-md);
        color: var(--ink-700);
      }
      .dish-meta {
        grid-column: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s-1) var(--s-2);
        margin-top: var(--s-1);
      }
      .dish-price {
        grid-row: 1;
        grid-column: 2;
        text-align: right;
        font-weight: 700;
        white-space: nowrap;
      }
      .dish-price .weekend {
        display: block;
        font-size: var(--t-xs);
        font-weight: 500;
        color: var(--ink-500);
      }
      .dish-action {
        grid-column: 2;
        align-self: end;
      }
      .dish.is-soldout .dish-name,
      .dish.is-soldout .dish-desc,
      .dish.is-soldout .dish-price {
        color: var(--ink-500);
      }
      .dish.is-soldout .dish-name {
        text-decoration: line-through;
        text-decoration-color: var(--line-strong);
      }
      .included {
        font-size: var(--t-sm);
        font-weight: 600;
        color: var(--ok-700);
        white-space: nowrap;
      }

      /* --- small parts --------------------------------------------------------- */
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: var(--t-xs);
        font-weight: 700;
        letter-spacing: 0.02em;
        border: 1px solid transparent;
      }
      .tag-soldout {
        background: var(--danger-100);
        color: var(--danger-700);
      }
      .tag-choice {
        background: var(--brand-100);
        color: var(--brand-700);
      }
      .tag-new {
        background: var(--ok-100);
        color: var(--ok-700);
      }
      .allergens {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--t-xs);
        color: var(--ink-500);
      }
      .allergens b {
        font-weight: 700;
        color: var(--ink-700);
        letter-spacing: 0.03em;
      }
      .allergen-note {
        display: flex;
        gap: var(--s-2);
        padding: var(--s-3);
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
        background: var(--brand-50);
        font-size: var(--t-sm);
        color: var(--ink-700);
        line-height: 1.5;
      }
      .allergen-note button {
        border: 0;
        background: none;
        padding: 0;
        color: var(--brand-700);
        font-weight: 700;
        text-decoration: underline;
      }

      /* --- buttons ------------------------------------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--s-2);
        min-height: var(--tap);
        padding: 0 var(--s-4);
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font-weight: 700;
        font-size: var(--t-base);
        text-decoration: none;
      }
      .btn-primary {
        background: var(--brand-600);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--brand-700);
      }
      .btn-secondary {
        background: var(--paper);
        color: var(--brand-700);
        border-color: var(--brand-200);
      }
      .btn-ghost {
        background: none;
        color: var(--ink-700);
        border-color: var(--line-strong);
      }
      .btn-quiet {
        background: none;
        border: 0;
        color: var(--brand-700);
        font-weight: 700;
        min-height: 36px;
        padding: 0 var(--s-1);
        text-decoration: underline;
      }
      .btn-danger {
        background: none;
        border: 0;
        color: var(--danger-700);
        font-weight: 600;
        min-height: 36px;
        padding: 0 var(--s-1);
      }
      .btn-sm {
        min-height: 36px;
        padding: 0 var(--s-3);
        font-size: var(--t-md);
      }
      .btn-block {
        width: 100%;
      }
      .btn[disabled],
      .btn[aria-disabled='true'] {
        background: var(--line);
        color: var(--ink-400);
        border-color: transparent;
        cursor: not-allowed;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-top-color: transparent;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }

      /* --- banners ------------------------------------------------------------- */
      .banner {
        display: flex;
        gap: var(--s-3);
        padding: var(--s-3) var(--s-4);
        border-radius: var(--radius);
        border: 1px solid;
        font-size: var(--t-md);
        line-height: 1.5;
      }
      .banner h3 {
        font-size: var(--t-base);
        font-weight: 700;
        margin-bottom: 2px;
      }
      .banner .icon {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        margin-top: 1px;
      }
      .banner-info {
        background: var(--brand-50);
        border-color: var(--brand-200);
        color: var(--ink-700);
      }
      .banner-info .icon {
        background: var(--brand-600);
      }
      .banner-warn {
        background: var(--warn-100);
        border-color: #eccb96;
        color: #6b4200;
      }
      .banner-warn .icon {
        background: var(--warn-700);
      }
      .banner-danger {
        background: var(--danger-100);
        border-color: #eeb7b1;
        color: #7d1c16;
      }
      .banner-danger .icon {
        background: var(--danger-700);
      }
      .banner-ok {
        background: var(--ok-100);
        border-color: #b6dcc4;
        color: #1f5537;
      }
      .banner-ok .icon {
        background: var(--ok-700);
      }
      .banner ul {
        margin-top: var(--s-2);
        display: flex;
        flex-direction: column;
        gap: var(--s-1);
        font-size: var(--t-md);
      }
      .banner li::before {
        content: '— ';
      }

      /* --- the day's order (cart) ---------------------------------------------- */
      .cart-menu {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--s-1) var(--s-3);
        padding: var(--s-3) var(--s-4);
        border-top: 1px solid var(--line);
      }
      .cart-menu:first-of-type {
        border-top: 0;
      }
      .cart-who {
        font-weight: 700;
        font-size: var(--t-base);
      }
      .cart-who .anon {
        font-weight: 500;
        color: var(--ink-500);
      }
      .cart-lines {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--t-md);
        color: var(--ink-700);
      }
      .cart-line {
        display: flex;
        gap: var(--s-3);
      }
      .cart-line .slot {
        flex: none;
        width: 84px;
        color: var(--ink-500);
        font-size: var(--t-sm);
        padding-top: 1px;
      }
      .cart-line .what {
        flex: 1;
        min-width: 0;
      }
      .cart-line .amt {
        flex: none;
        margin-left: auto;
        white-space: nowrap;
      }
      .cart-line.adj .what {
        color: var(--brand-700);
        font-weight: 600;
      }
      .cart-line.adj .amt {
        color: var(--brand-700);
        font-weight: 700;
      }
      .cart-menu-total {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: var(--s-3);
        margin-top: var(--s-2);
        padding-top: var(--s-2);
        border-top: 1px dashed var(--line-strong);
        font-weight: 700;
      }
      .cart-menu-total .amt {
        flex: none;
        margin-left: auto;
      }
      .cart-actions {

        gap: var(--s-3);

        color: var(--ink-400);

      .stepper .qty {
        min-width: 26px;
        text-align: center;

      .extra .amt {
        flex: none;
        width: 68px;
        text-align: right;
        font-weight: 600;
        font-size: var(--t-md);

      /* --- overlays: composer, pickers, sheets ---------------------------------- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(33, 28, 22, 0.5);

        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        background: var(--ground);
        width: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;

        overflow: hidden;

      .sheet-head {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        padding: var(--s-3) var(--s-4);
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .sheet-head .titles {
        min-width: 0;
      }
      .sheet-head h2 {
        font-family: var(--font-display);
        font-size: var(--t-lg);
        font-weight: 500;
      }
      .sheet-head .sub {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .sheet-close {
        margin-left: auto;
        width: var(--tap);
        height: var(--tap);
        border: 0;
        border-radius: 50%;
        background: var(--brand-50);
        color: var(--brand-700);
        font-size: 20px;
        line-height: 1;
        flex: none;
      }
      .sheet-body {
        flex: 1;
        overflow-y: auto;
        padding: var(--s-4);
        display: flex;
        flex-direction: column;
        gap: var(--s-4);

      .sheet-foot {
        padding: var(--s-3) var(--s-4);
        background: var(--paper);
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
        box-shadow: var(--shadow-bar);
      }

      .slots {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .slot-row {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        width: 100%;
        min-height: 56px;
        padding: var(--s-2) var(--s-4);
        border: 0;
        border-top: 1px solid var(--line);
        background: none;
        text-align: left;
      }
      .slot-row:first-child {
        border-top: 0;
      }
      .slot-row .label {
        flex: none;
        width: 84px;
        font-size: var(--t-sm);
        font-weight: 700;
        color: var(--ink-500);
        letter-spacing: 0.02em;
      }
      .slot-row .value {
        flex: 1;
        min-width: 0;
      }
      .slot-row .value .picked {
        font-family: var(--font-display);
        font-size: var(--t-base);
        font-weight: 500;
      }
      .slot-row .value .placeholder {
        color: var(--ink-500);
      }
      .slot-row .value .sub {
        display: block;
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .slot-row .amt {
        font-weight: 600;
        font-size: var(--t-md);
        white-space: nowrap;
      }
      .slot-row .chev {
        color: var(--ink-400);
        font-size: 18px;
        flex: none;
      }
      .slot-row.is-required {
        background: var(--danger-100);
      }
      .slot-row.is-required .label {
        color: var(--danger-700);
      }
      .slot-req {
        display: block;
        font-size: var(--t-sm);
        font-weight: 700;
        color: var(--danger-700);
      }

      .options {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .option {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: var(--s-1) var(--s-3);
        width: 100%;
        padding: var(--s-3) var(--s-4);
        border: 0;
        border-top: 1px solid var(--line);
        background: none;
        text-align: left;
        align-items: start;
      }
      .option:first-child {
        border-top: 0;
      }
      .option .radio {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--line-strong);
        margin-top: 1px;
      }
      .option[aria-checked='true'] .radio {
        border-color: var(--brand-600);
        background:
          radial-gradient(circle at center, var(--brand-600) 0 5px, transparent 5px);
      }
      .option .oname {
        font-family: var(--font-display);
        font-size: var(--t-base);
        font-weight: 500;
      }
      .option .osub {
        grid-column: 2;
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .option .oamt {
        font-weight: 600;
        white-space: nowrap;
        font-size: var(--t-md);
      }
      .option[aria-disabled='true'] {
        cursor: not-allowed;
      }
      .option[aria-disabled='true'] .oname,
      .option[aria-disabled='true'] .oamt {
        color: var(--ink-400);
        text-decoration: line-through;
        text-decoration-color: var(--line-strong);
      }

      .pricebox {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: var(--s-3) var(--s-4);
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--t-md);
      }
      .pricebox .row {
        display: flex;
        gap: var(--s-3);
      }
      .pricebox .row .amt {
        flex: none;
        margin-left: auto;
        white-space: nowrap;
      }
      .pricebox .row.adj {
        color: var(--brand-700);
        font-weight: 600;
      }
      .pricebox .row.total {
        margin-top: var(--s-2);
        padding-top: var(--s-2);
        border-top: 1px dashed var(--line-strong);
        font-size: var(--t-base);
        font-weight: 700;
      }
      .pricebox .why {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }

      /* --- forms ---------------------------------------------------------------- */
      .fields {
        display: flex;
        flex-direction: column;
        gap: var(--s-4);
      }
      .field label {
        display: block;
        font-size: var(--t-md);
        font-weight: 700;
        margin-bottom: var(--s-1);
      }
      .field .req {
        color: var(--danger-700);
      }
      .field .control {
        width: 100%;
        min-height: var(--tap);
        padding: 10px var(--s-3);
        font: inherit;
        color: var(--ink-900);
        background: var(--paper);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-sm);
      }
      .field textarea.control {
        min-height: 88px;
        resize: vertical;
      }
      .field .control::placeholder {
        color: var(--ink-500);
      }
      .field .help {
        margin-top: var(--s-1);
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .field.has-error .control {
        border-color: var(--danger-700);
        background: var(--danger-100);
      }
      .field .error {
        margin-top: var(--s-1);
        font-size: var(--t-sm);
        font-weight: 600;
        color: var(--danger-700);
      }

      /* --- totals + sticky summary ---------------------------------------------- */
      .totals {
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .totals .day-block {

        flex-direction: column;
        gap: 2px;
        font-size: var(--t-md);
      }
      .totals .day-block .dh {
        font-weight: 700;
        font-size: var(--t-base);

      .totals .row {

        gap: var(--s-3);
        color: var(--ink-700);

      .totals .row.fee .what {

        align-items: baseline;
        gap: var(--s-3);
        margin-top: var(--s-2);

        font-weight: 700;

        font-family: var(--font-display);
        font-size: var(--t-xl);
      }
      .totals .sep {
        height: 1px;
        background: var(--line);
        margin: var(--s-2) 0;
      }

      .sumbar {
        position: sticky;
        bottom: 0;
        z-index: 8;
        margin-top: auto;
        background: var(--paper);
        border-top: 1px solid var(--line);
        box-shadow: var(--shadow-bar);
        padding: var(--s-3) var(--s-4) var(--s-4);
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .sumbar .line {
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .sumbar .what {
        font-size: var(--t-sm);
        color: var(--ink-500);
      }
      .sumbar .total {
        font-family: var(--font-display);
        font-size: var(--t-xl);
        font-weight: 600;
      }
      .sumbar .toggle {
        margin-left: auto;
        border: 0;
        background: none;
        color: var(--brand-700);
        font-weight: 700;
        font-size: var(--t-md);
        text-decoration: underline;
        min-height: 36px;
      }
      .sumbar .detail {
        border-top: 1px dashed var(--line-strong);
        padding-top: var(--s-3);
      }

      /* --- success -------------------------------------------------------------- */
      .success-mark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--ok-100);
        color: var(--ok-700);
        display: grid;
        place-items: center;
        font-size: 32px;
        font-weight: 700;
      }
      .success h1 {
        font-family: var(--font-display);
        font-size: var(--t-2xl);
        font-weight: 500;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      .success .lead {
        color: var(--ink-700);
        max-width: 60ch;
      }
      .order-id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: var(--t-sm);
        color: var(--ink-500);
      }

      /* --- standalone message screens ------------------------------------------- */
      .message {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--s-3);
        padding: var(--s-6) var(--s-4);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-1);
      }
      .message h1 {
        font-family: var(--font-display);
        font-size: var(--t-xl);
        font-weight: 500;
        text-wrap: balance;
      }
      .message p {
        color: var(--ink-700);
        max-width: 56ch;
      }
      .message .contact {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-2) var(--s-4);
        font-size: var(--t-md);
        color: var(--ink-700);
      }

      .footer {
        padding: var(--s-6) var(--s-4) var(--s-8);
        background: var(--brand-900);
        color: var(--brand-200);
        font-size: var(--t-sm);
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        gap: var(--s-1);
      }
      .footer b {
        color: #fff;
      }

      /* ======================================================================
         Desktop — the same components, two columns. Container queries so the
         mockup reacts to the device frame, not to the reviewer's window.
         ====================================================================== */
      @container app (min-width: 900px) {
        .masthead {
          padding: var(--s-4) var(--s-8);
        }
        .masthead svg {
          width: 128px;
        }
        .weekbar {
          padding: var(--s-6) var(--s-8) 0;
        }
        .weekbar h1 {
          font-size: var(--t-2xl);
        }
        .daybar {
          top: 68px;
          padding: 0 var(--s-8);
        }
        .daybar ul {
          padding-inline: 0;
          gap: var(--s-2);
        }
        .day {
          min-width: 104px;
          flex-direction: row;
          gap: var(--s-2);
          align-items: baseline;
        }
        .screen {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 372px;
          gap: var(--s-6);
          align-items: start;
          padding: var(--s-6) var(--s-8) var(--s-10);
          max-width: 1280px;
          width: 100%;
          margin: 0 auto;
        }
        .screen.single {
          grid-template-columns: minmax(0, 760px);
          justify-content: center;
        }
        .rail {
          display: flex;
          flex-direction: column;
          gap: var(--s-4);
          position: sticky;
          top: 124px;
        }
        .sumbar {
          position: static;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          box-shadow: var(--shadow-1);
        }
        .overlay {
          align-items: center;
          padding: var(--s-8);
        }
        .sheet {
          max-width: 640px;
          border-radius: var(--radius-lg);
          max-height: 86%;
        }
        .sheet-foot {
          flex-direction: row-reverse;
          align-items: center;
        }
        .sheet-foot .btn {
          flex: 1;
        }
        .dish {
          padding: var(--s-4) var(--s-5);
        }
        .success h1 {
          font-size: var(--t-3xl);
        }
        .message h1 {
          font-size: var(--t-2xl);
        }
        .footer {
          padding: var(--s-8);
        }
      }
      .banners {
        display: flex;
        flex-direction: column;
        gap: var(--s-3);
      }
      .banners:empty {
        display: none;
      }
      .opt-group {
        padding: var(--s-2) var(--s-4);
        background: var(--brand-50);
        border-top: 1px solid var(--line);
        font-size: var(--t-xs);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-700);
      }
      .only-desktop {
        display: none;
      }
      @container app (min-width: 900px) {
        .screen:not(.single) > .banners {
          grid-column: 1 / -1;
          grid-row: 1;
        }
        .screen:not(.single) > .col-main {
          grid-column: 1;
          grid-row: 2;
        }
        .screen:not(.single) > .rail {
          grid-column: 2;
          grid-row: 2;
        }
        .only-desktop {
          display: flex;
        }
        .only-mobile {
          display: none !important;
        }
      }
    </style>
  </head>

      const isWeekend = (date) => dayOf(date).dow === 6;
      const priceOf = (item, date) =>
        !item ? 0 : isWeekend(date) ? item.priceWeekend : item.priceWeekday;
      const dayOf = (date) => DAYS.find((d) => d.date === date);

      /** @returns {{lines: Array, total: number, errors: string[]}} */
      function priceMenu(m, date) {
        const lines = [];
        const errors = [];
        const soupItem = m.soup ? ITEMS[m.soup] : null;
        const mainItem = m.main ? ITEMS[m.main] : null;
        const includesSoup = !!(mainItem && mainItem.soupIncluded);

        if (soupItem) {
          lines.push({
            slot: S.composer.slots.soup,
            what: soupItem.name,
            amount: 0,
            note: includesSoup ? S.dish.soupIncluded : null,
          });
        }
        if (mainItem) {
          lines.push({
            slot: S.composer.slots.main,
            what: mainItem.name + (m.variation ? ' — ' + m.variation : ''),
            amount: priceOf(mainItem, date),
          });
        }
        if (mainItem && !soupItem && includesSoup) {
          lines.push({
            adj: true,
            what: S.composer.noSoupDiscount,
            amount: -CFG.pricing.noSoupDiscount,
          });
        }
        if (soupItem && !includesSoup) {
          lines.push({
            adj: true,
            what: S.composer.soupSurcharge,
            amount: CFG.pricing.soupPrice,
            why: S.composer.soupSurchargeWhy,
          });
        }
        for (const slot of ['side', 'pickle', 'dessert']) {
          const it = m[slot] ? ITEMS[m[slot]] : null;
          if (it) {
            lines.push({ slot: S.composer.slots[slot], what: it.name, amount: priceOf(it, date) });
          }
        }

        if (mainItem && mainItem.variations && !m.variation) errors.push('variation');
        if (mainItem && mainItem.requiresSide && !m.side) errors.push('side');
        if (!soupItem && !mainItem && !m.side && !m.pickle && !m.dessert) errors.push('empty');

        return { lines, total: lines.reduce((s, l) => s + l.amount, 0), errors };
      }

      /** Per delivery day: food subtotal (extras included), fee, total, minimum check. */
      function priceDay(day) {
        const menus = day.menus.map((m) => ({ menu: m, price: priceMenu(m, day.date) }));
        const extras = (day.extras || [])
          .filter((e) => e.qty > 0)
          .map((e) => {
            const cfg = CFG.extras.find((x) => x.key === e.key);
            return { ...cfg, qty: e.qty, amount: cfg.price * e.qty };
          });
        const food =
          menus.reduce((s, m) => s + m.price.total, 0) + extras.reduce((s, e) => s + e.amount, 0);
        const fee = CFG.pricing.deliveryFee;
        return {
          date: day.date,
          menus,
          extras,
          food,
          fee,
          total: food + fee,
          missing: Math.max(0, CFG.pricing.minimumOrder - food),
        };
      }

            ? '<span class="weekend">' + esc(S.dish.weekendPrice(money(item.priceWeekend))) + '</span>'
            : '') +
          '</div>'
        );
      };

      /* ------------------------------------------------------------------ *
       * 6. COMPONENTS
       * ------------------------------------------------------------------ */
      function Masthead() {
        return (
          '<header class="masthead">' +
          LOGO +
          '<div class="masthead-meta">' +
          esc(S.order.intake) +
          '<br /><a href="tel:+36304901122">' +
          esc(S.order.phone) +
          '</a></div></header>'
        );
      }

      function WeekBar(vm) {
        const first = DAYS[0].date;
        const last = DAYS[DAYS.length - 1].date;
        return (
          '<div class="weekbar"><h1>' +
          esc(S.week.heading) +
          '</h1><div class="week-meta"><span class="week-pill">' +
          esc(S.week.number(WEEK.isoWeek)) +
          '</span><span>' +
          esc(S.week.range(fmt(first, { month: 'long', day: 'numeric' }), dateNum(last) + '.')) +
          '</span><span>' +
          esc(vm.cutoffNote || S.week.cutoffToday) +
          '</span></div></div>'
        );
      }

      function DayBar(vm) {
        const items = DAYS.map((d) => {
          const state = vm.dayStates[d.date] || 'open';
          const cartDay = vm.cart.find((c) => c.date === d.date);
          const n = cartDay ? cartDay.menus.length : 0;
          const selected = d.date === vm.activeDate;
          const disabled = state !== 'open';
          return (
            '<li><button type="button" class="day" data-day="' +
            d.date +
            '" role="tab" aria-selected="' +
            selected +
            '"' +
            (disabled
              ? ' disabled title="' +
                esc(state === 'closed' ? S.errors.closedDay : S.days.pastTitle) +
                '"'
              : '') +
            '><span class="dow">' +
            esc(dayShort(d.date)) +
            '</span>' +
            (state === 'closed'
              ? '<span class="dclosed">' + esc(S.days.closed) + '</span>'
              : '<span class="dnum num">' + esc(dateNum(d.date)) + '.</span>') +
            (n
              ? '<span class="dbadge num" title="' + esc(S.days.badgeTitle(n)) + '">' + n + '</span>'
              : '') +
            '</button></li>'
          );
        }).join('');
        return '<nav class="daybar"><ul role="tablist">' + items + '</ul></nav>';
      }

      function Banner(b) {
        return (
          '<div class="banner banner-' +
          b.kind +
          '" role="' +
          (b.kind === 'danger' ? 'alert' : 'status') +
          '"><span class="icon" aria-hidden="true">' +
          (b.kind === 'danger' ? '!' : b.kind === 'ok' ? '✓' : 'i') +
          '</span><div><h3>' +
          esc(b.title) +
          '</h3><p>' +
          esc(b.body) +
          '</p>' +
          (b.items
            ? '<ul>' + b.items.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ul>'
            : '') +
          (b.action
            ? '<p style="margin-top:12px"><button type="button" class="btn btn-secondary btn-sm">' +
              esc(b.action) +
              '</button></p>'
            : '') +
          '</div></div>'
        );
      }

      function Dish(item, date, opts = {}) {
        const soldOut = !!item.soldOut;
        const isSoup = item.cat === 'daily_soup';
        return (
          '<div class="' +
          cls('dish', soldOut && 'is-soldout') +
          '"><div class="dish-name">' +
          esc(item.name) +
          '</div>' +
          (isSoup
            ? '<div class="included">' + esc(S.dish.soupIncluded) + '</div>'
            : priceCell(item, date)) +
          (item.desc ? '<p class="dish-desc">' + esc(item.desc) + '</p>' : '') +
          '<div class="dish-meta">' +
          (soldOut ? '<span class="tag tag-soldout">' + esc(S.dish.soldOut) + '</span>' : '') +
          (item.variations
            ? '<span class="tag tag-choice">' +
              esc(S.dish.hasVariations + ': ' + item.variations.join(' · ')) +
              '</span>'
            : '') +
          (item.requiresSide ? '<span class="tag tag-choice">' + esc(S.dish.needsSide) + '</span>' : '') +
          allergenCodes(item) +
          '</div>' +
          (opts.action && !soldOut
            ? '<div class="dish-action"><button type="button" class="btn btn-secondary btn-sm" data-compose="' +
              item.id +
              '">' +
              esc(S.dish.compose) +
              '</button></div>'
            : '') +
          '</div>'
        );
      }

      function Section(title, items, date, opts = {}) {
        if (!items.length) return '';
        return (
          '<section><div class="section-h"><h2>' +
          esc(title) +
          '</h2>' +
          (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') +
          '</div><div class="dishes">' +
          items.map((i) => Dish(i, date, opts)).join('') +
          '</div></section>'
        );
      }

      function CartCard(vm) {
        const day = vm.cart.find((c) => c.date === vm.activeDate);
        const priced = day ? priceDay(day) : null;
        const head =
          '<div class="card-head"><h2>' +
          esc(S.cart.title) +
          '</h2><span class="count">' +
          esc(cap(dayFull(vm.activeDate))) +
          '</span></div>';

        if (!priced || !priced.menus.length) {
          return (
            '<div class="card">' +
            head +
            '<div class="cart-empty"><p><b>' +
            esc(S.cart.empty) +
            '</b></p><p>' +
            esc(S.cart.emptyCta) +
            '</p></div></div>'
          );
        }

        const menus = priced.menus
          .map((m, idx) => {
            const lines = m.price.lines
              .map(
                (l) =>
                  '<div class="' +
                  cls('cart-line', l.adj && 'adj') +
                  '"><span class="slot">' +
                  esc(l.slot || '') +
                  '</span><span class="what">' +
                  esc(l.what) +
                  '</span><span class="amt num">' +
                  (l.adj ? signed(l.amount) : money(l.amount)) +
                  '</span></div>',
              )
              .join('');
            return (
              '<div class="cart-menu"><div class="cart-who">' +
              (m.menu.recipient
                ? esc(m.menu.recipient)
                : '<span class="anon">' + esc(S.cart.menuNumber(idx + 1)) + ' · ' + esc(S.cart.anonymous) + '</span>') +
              '</div><div class="cart-lines">' +
              lines +
              '</div><div class="cart-menu-total"><span>' +
              esc(S.composer.priceTotal) +
              '</span><span class="amt num">' +
              money(m.price.total) +
              '</span></div><div class="cart-actions"><button type="button" class="btn-quiet">' +
              esc(S.cart.edit) +
              '</button><button type="button" class="btn-danger" data-remove="' +
              idx +
              '">' +
              esc(S.cart.remove) +
              '</button></div></div>'
            );
          })
          .join('');

        const extras = CFG.extras
          .map((x) => {
            const qty = ((day.extras || []).find((e) => e.key === x.key) || {}).qty || 0;
            return (
              '<div class="extra"><span class="name">' +
              esc(x.name) +
              '<small>' +
              money(x.price) +
              ' / db</small></span><span class="stepper"><button type="button" aria-label="' +
              esc(S.extras.less) +
              '" data-extra="' +
              x.key +
              '" data-delta="-1"' +
              (qty ? '' : ' disabled') +
              '>−</button><span class="qty num">' +
              qty +
              '</span><button type="button" aria-label="' +
              esc(S.extras.more) +
              '" data-extra="' +
              x.key +
              '" data-delta="1">+</button></span><span class="amt num">' +
              (qty ? money(qty * x.price) : '—') +
              '</span></div>'
            );
          })
          .join('');

        return (
          '<div class="card">' +
          head +
          menus +
          '<div class="extras"><div class="section-h"><h2 style="font-size:var(--t-base)">' +
          esc(S.extras.title) +
          '</h2><span class="hint">' +
          esc(S.extras.hint) +
          '</span></div>' +
          extras +
          '</div><div class="card-body" style="border-top:1px solid var(--line);display:flex;gap:12px;font-weight:700"><span>' +
          esc(S.cart.foodSubtotal) +
          '</span><span class="num" style="margin-left:auto">' +
          money(priced.food) +
          '</span></div>' +
          '<div class="card-body" style="border-top:1px solid var(--line)"><button type="button" class="btn btn-secondary btn-block" data-compose="new">' +
          esc(S.cart.addAnother) +
          '</button></div></div>'
        );
      }

      function Totals(cart, opts = {}) {
        const p = priceCart(cart);
        if (!p.days.length) {
          return (
            '<div class="totals"><p><b>' +
            esc(S.summary.empty) +
            '</b></p><p style="color:var(--ink-500);font-size:var(--t-md)">' +
            esc(S.summary.emptyHint) +
            '</p></div>'
          );
        }
        const blocks = p.days
          .map(
            (d) =>
              '<div class="day-block"><div class="dh">' +
              esc(cap(dayFull(d.date))) +
              '</div><div class="row"><span class="what">' +
              esc(S.summary.food) +
              '</span><span class="amt num">' +
              money(d.food) +
              '</span></div><div class="row fee"><span class="what">' +
              esc(S.summary.deliveryFee) +
              '</span><span class="amt num">' +
              money(d.fee) +
              '</span></div>' +
              (d.missing > 0
                ? '<div class="row" style="color:var(--warn-700);font-weight:600"><span class="what">' +
                  esc(S.summary.minimumWarning(cap(dayLong(d.date)), money(d.missing))) +
                  '</span></div>'
                : '') +
              '</div>',
          )
          .join('<div class="sep"></div>');
        return (
          '<div class="totals">' +
          blocks +
          '<div class="grand"><span>' +
          esc(S.summary.grandTotal) +
          '</span><span class="amt num">' +
          money(p.grand) +
          '</span></div>' +
          (opts.feeNote
            ? '<p style="font-size:var(--t-sm);color:var(--ink-500)">' + esc(S.summary.feeNote) + '</p>'
            : '') +
          '</div>'
        );
      }

      function SummaryBar(vm, variant) {
        const p = priceCart(vm.cart);
        const blocked = p.belowMinimum.length > 0;
        const open = variant === 'desktop' ? true : vm.summaryOpen;
        const dayNames = p.belowMinimum.map((d) => dayLong(d.date)).join(', ');
        const header =
          variant === 'desktop'
            ? '<div class="line"><span class="total">' + esc(S.summary.title) + '</span></div>'
            : '<div class="line"><div><div class="what">' +
              esc(
                p.days.length
                  ? S.summary.barMenus(p.menuCount) + ' · ' + S.summary.barDays(p.days.length)
                  : S.summary.empty,
              ) +
              '</div><div class="total num">' +
              money(p.grand) +
              '</div></div><button type="button" class="toggle" data-toggle="summary">' +
              esc(open ? S.summary.hideDetails : S.summary.details) +
              '</button></div>';
        return (
          '<div class="' +
          cls('sumbar', variant === 'desktop' ? 'only-desktop' : 'only-mobile') +
          '">' +
          header +
          (open ? '<div class="detail">' + Totals(vm.cart, { feeNote: true }) + '</div>' : '') +
          (blocked
            ? '<div class="banner banner-warn" role="status"><span class="icon" aria-hidden="true">!</span><div><p>' +
              esc(S.summary.minimumBlocked(dayNames)) +
              '</p></div></div>'
            : '') +
          '<button type="button" class="btn btn-primary btn-block"' +
          (blocked || !p.days.length ? ' aria-disabled="true" disabled' : ' data-go="checkout"') +
          '>' +
          esc(S.summary.continue) +
          '</button></div>'
        );
      }

      /* --- overlays ------------------------------------------------------- */
      function Sheet(title, sub, body, foot) {
        return (
          '<div class="overlay" data-close-overlay><div class="sheet" role="dialog" aria-modal="true" aria-label="' +
          esc(title) +
          '"><div class="sheet-head"><div class="titles"><h2>' +
          esc(title) +
          '</h2>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
          '</div><button type="button" class="sheet-close" aria-label="' +
          esc(S.common.close) +
          '" data-close-overlay>×</button></div><div class="sheet-body">' +
          body +
          '</div>' +
          (foot ? '<div class="sheet-foot">' + foot + '</div>' : '') +
          '</div></div>'
        );
      }

      function slotOptions(slot, date) {
        const d = WEEK.byDate[date];
        if (slot === 'soup') return [{ items: d.soups }];
        if (slot === 'main')
          return [
            { label: S.sections.mains, items: d.mains },
            { label: S.sections.featured, items: WEEK.featured },
            { label: S.sections.allWeek, items: WEEK.allWeek },
          ];
        if (slot === 'side')
          return [
            { label: S.sections.sides, items: WEEK.sides },
            { label: S.sections.sideExtras, items: WEEK.sideExtras },
          ];
        if (slot === 'pickle') return [{ items: WEEK.pickles }];
        return [{ items: WEEK.desserts }];
      }

      function ComposerSheet(vm) {
        const c = vm.composer;
        const date = vm.activeDate;
        const p = priceMenu(c, date);
        const mainItem = c.main ? ITEMS[c.main] : null;
        const needsVariation = !!(mainItem && mainItem.variations);
        const needsSide = !!(mainItem && mainItem.requiresSide);

        const slotRow = (slot, opts = {}) => {
          const item = c[slot] ? ITEMS[c[slot]] : null;
          const missing = opts.required && !item;
          const amountLine = p.lines.find((l) => l.slot === S.composer.slots[slot]);
          let amt = '';
          if (item) {
            if (slot === 'soup') {
              const surcharge = p.lines.find((l) => l.adj && l.amount > 0);
              amt = surcharge ? signed(surcharge.amount) : S.dish.soupIncluded;
            } else {
              amt = money(amountLine ? amountLine.amount : 0);
            }
          }
          return (
            '<button type="button" class="' +
            cls('slot-row', missing && 'is-required') +
            '" data-slot="' +
            slot +
            '"><span class="label">' +
            esc(S.composer.slots[slot]) +
            '</span><span class="value">' +
            (item
              ? '<span class="picked">' +
                esc(item.name) +
                '</span>' +
                (slot === 'main' && c.variation
                  ? '<span class="sub">' + esc(c.variation) + '</span>'
                  : '')
              : '<span class="placeholder">' +
                esc(opts.required ? S.composer.choose : S.composer.none) +
                '</span>') +
            (missing
              ? '<span class="sub slot-req">' +
                esc(slot === 'side' ? S.composer.sideMissing : S.composer.choose) +
                '</span>'
              : '') +
            '</span><span class="amt num">' +
            esc(amt) +
            '</span><span class="chev" aria-hidden="true">›</span></button>'
          );
        };

        const variationRow =
          needsVariation &&
          '<button type="button" class="' +
            cls('slot-row', !c.variation && 'is-required') +
            '" data-slot="variation"><span class="label">' +
            esc(S.composer.variationLabel) +
            '</span><span class="value">' +
            (c.variation
              ? '<span class="picked">' + esc(c.variation) + '</span>'
              : '<span class="placeholder">' + esc(S.composer.variationMissing) + '</span>') +
            '<span class="sub">' +
            esc(mainItem.name) +
            '</span></span><span class="chev" aria-hidden="true">›</span></button>';

        const priceRows = p.lines
          .map(
            (l) =>
              '<div class="' +
              cls('row', l.adj && 'adj') +
              '"><span>' +
              esc(l.what) +
              '</span><span class="amt num">' +
              (l.amount === 0 ? (l.note ? esc(l.note) : money(0)) : l.adj ? signed(l.amount) : money(l.amount)) +
              '</span></div>' +
              (l.why ? '<div class="why">' + esc(l.why) + '</div>' : ''),
          )
          .join('');

        const body =
          '<div class="field"><label for="who">' +
          esc(S.composer.recipientLabel) +
          '</label><input class="control" id="who" placeholder="' +
          esc(S.composer.recipientPlaceholder) +
          '" value="' +
          esc(c.recipient || '') +
          '" /><p class="help">' +
          esc(S.composer.recipientHelp) +
          '</p></div>' +
          '<div class="slots">' +
          slotRow('soup') +
          slotRow('main') +
          (variationRow || '') +
          (needsSide ? slotRow('side', { required: true }) : '') +
          slotRow('pickle') +
          slotRow('dessert') +
          '</div>' +
          (p.lines.length
            ? '<div class="pricebox">' +
              priceRows +
              '<div class="row total"><span>' +
              esc(S.composer.priceTotal) +
              '</span><span class="amt num">' +
              money(p.total) +
              '</span></div></div>'
            : '<div class="banner banner-info"><span class="icon" aria-hidden="true">i</span><div><p>' +
              esc(S.composer.emptyMenu) +
              '</p></div></div>');

        const invalid = p.errors.length > 0;
        const foot =
          '<button type="button" class="btn btn-primary btn-block"' +
          (invalid ? ' aria-disabled="true" disabled' : ' data-add="1"') +
          '>' +
          esc(invalid ? S.composer.add(money(p.total)) : S.composer.add(money(p.total))) +
          '</button>' +
          (invalid
            ? '<p class="field"><span class="error">' +
              esc(
                p.errors.includes('variation')
                  ? S.composer.variationMissing
                  : p.errors.includes('side')
                    ? S.composer.sideMissing
                    : S.composer.emptyMenu,
              ) +
              '</span></p>'
            : '<button type="button" class="btn btn-ghost btn-block" data-close-overlay>' +
              esc(S.composer.cancel) +
              '</button>');

        return Sheet(
          c.editing ? S.composer.editTitle : S.composer.title,
          cap(dayFull(date)),
          body,
          foot,
        );
      }

      function PickerSheet(vm) {
        const slot = vm.picker.slot;
        const date = vm.activeDate;
        const c = vm.composer;

        if (slot === 'variation') {
          const mainItem = ITEMS[c.main];
          const opts = mainItem.variations
            .map(
              (v) =>
                '<button type="button" class="option" role="radio" aria-checked="' +
                (c.variation === v) +
                '" data-pick-variation="' +
                esc(v) +
                '"><span class="radio"></span><span class="oname">' +
                esc(v) +
                '</span><span class="oamt"></span></button>',
            )
            .join('');
          return Sheet(
            S.composer.variationOf(mainItem.name),
            cap(dayFull(date)),
            '<div class="options" role="radiogroup">' + opts + '</div>',
            '',
          );
        }

        const groups = slotOptions(slot, date);
        const none =
          '<button type="button" class="option" role="radio" aria-checked="' +
          !c[slot] +
          '" data-pick="" data-slot="' +
          slot +
          '"><span class="radio"></span><span class="oname">' +
          esc(S.composer.none) +
          '</span><span class="oamt"></span></button>';

        const body = groups
          .map(
            (g) =>
              (g.label ? '<div class="opt-group">' + esc(g.label) + '</div>' : '') +
              g.items
                .map((it) => {
                  const soldOut = !!it.soldOut;
                  const amount =
                    it.cat === 'daily_soup'
                      ? c.main && ITEMS[c.main].soupIncluded
                        ? S.dish.soupIncluded
                        : signed(CFG.pricing.soupPrice)
                      : priceOf(it, date) === 0
                        ? money(0)
                        : money(priceOf(it, date));
                  return (
                    '<button type="button" class="option" role="radio" aria-checked="' +
                    (c[slot] === it.id) +
                    '"' +
                    (soldOut ? ' aria-disabled="true" disabled' : '') +
                    ' data-pick="' +
                    it.id +
                    '" data-slot="' +
                    slot +
                    '"><span class="radio"></span><span class="oname">' +
                    esc(it.name) +
                    (soldOut ? ' <span class="tag tag-soldout">' + esc(S.dish.soldOut) + '</span>' : '') +
                    '</span><span class="oamt num">' +
                    esc(amount) +
                    '</span>' +
                    (it.desc || (it.allergens && it.allergens.length)
                      ? '<span class="osub">' +
                        esc(it.desc || '') +
                        (it.allergens && it.allergens.length
                          ? ' · ' + esc(S.allergens.codesLabel + ' ' + it.allergens.join(', '))
                          : '') +
                        '</span>'
                      : '') +
                    '</button>'
                  );
                })
                .join(''),
          )
          .join('');

        return Sheet(
          S.composer.pickerTitle(S.composer.slots[slot]),
          cap(dayFull(date)),
          '<div class="options" role="radiogroup">' + none + body + '</div>',
          '',
        );
      }

      function AllergenSheet() {
        const list = S.allergens.list
          .map(
            (name, i) =>
              '<div class="cart-line"><span class="slot num">' +
              (i + 1) +
              '.</span><span class="what">' +
              esc(name) +
              '</span></div>',
          )
          .join('');
        return Sheet(
          S.allergens.title,
          '',
          '<p style="font-size:var(--t-md);line-height:1.6">' +
            esc(S.allergens.notice) +
            '</p><div class="card"><div class="card-body"><div class="cart-lines">' +
            list +
            '</div></div></div>',
          '<button type="button" class="btn btn-ghost btn-block" data-close-overlay>' +
            esc(S.common.close) +
            '</button>',
        );
      }

      /* --- screens --------------------------------------------------------- */
      function MenuScreen(vm) {
        const d = WEEK.byDate[vm.activeDate];
        const date = vm.activeDate;
        const main =
          Section(S.sections.soups, d.soups, date, { hint: S.sections.soupsHint }) +
          Section(S.sections.mains, d.mains, date, { action: true }) +
          Section(S.sections.featured, WEEK.featured, date, {
            action: true,
            hint: S.sections.weekendHint,
          }) +
          Section(S.sections.allWeek, WEEK.allWeek, date, { action: true }) +
          Section(S.sections.sideExtras, WEEK.sideExtras, date) +
          Section(S.sections.pickles, WEEK.pickles, date) +
          Section(S.sections.desserts, WEEK.desserts, date) +
          '<div class="allergen-note"><span aria-hidden="true">⚠</span><p>' +
          esc(S.allergens.notice) +
          ' <button type="button" data-open="allergens">' +
          esc(S.allergens.link) +
          '</button></p></div>';

        return (
          '<div class="screen">' +
          '<div class="banners">' +
          (vm.banners || []).map(Banner).join('') +
          '</div>' +
          '<div class="rail">' +
          CartCard(vm) +
          SummaryBar(vm, 'desktop') +
          '</div>' +
          '<div class="col-main">' +
          main +
          '</div>' +
          '</div>' +
          SummaryBar(vm, 'mobile')

          'px;--h:' +
          spec.h +
          'px;--s:' +
          scale +
          '">' +
          markup +
          '</div></div></div>'
        );
      }

      function renderGallery() {
        const scale = 200 / MOBILE.w;
        const cards = STATES.map((s) => {
          const markup = App(s.vm());
          return (
            '<div class="device-slot"><span class="device-label">' +
            esc(s.label) +
            '</span><div class="device-box" style="--w:375px;--h:812px;--s:' +
            scale +
            '"><div class="device" style="--w:375px;--h:812px">' +
            markup +
            '</div></div></div>'
          );
        }).join('');
        stage.innerHTML =
          '<p class="state-note"><b>Áttekintés</b> — mind a ' +
          STATES.length +
          ' állapot mobilnézetben. Válassz egy állapotot fent a részletes nézethez.</p>' +
          '<div class="gallery-grid" style="grid-template-columns:repeat(auto-fill,200px)">' +
          cards +
          '</div>';
      }

      function render() {
        if (view === 'all') return renderGallery();
        const state = STATES.find((s) => s.id === currentId);
        const markup = App(vm);
        const avail = stage.clientWidth || 1000;
        let mS = 1;
        let dS = 1;
        if (view === 'mobile') {
          mS = Math.min(1, avail / MOBILE.w);
        } else if (view === 'desktop') {
          dS = Math.min(1, avail / DESKTOP.w);
        } else {
          mS = Math.min(1, avail / MOBILE.w);
          const rest = avail - MOBILE.w * mS - 40;
          dS = rest >= 360 ? Math.min(1, rest / DESKTOP.w) : Math.min(1, avail / DESKTOP.w);
        }
        const frames =
          (view !== 'desktop' ? frame(MOBILE, mS, markup) : '') +
          (view !== 'mobile' ? frame(DESKTOP, dS, markup) : '');
        stage.innerHTML =
          '<p class="state-note">' +
          state.note +
          '</p><div class="devices">' +
          frames +
          '</div>';
      }

      function loadState(id) {
        const state = STATES.find((s) => s.id === id) || STATES[0];
        currentId = state.id;
        vm = state.vm();
        stateSelect.value = currentId;
        if (location.hash.slice(1) !== currentId) history.replaceState(null, '', '#' + currentId);
        render();
      }

      /* --- interactions: the mockup is clickable so the flow can be judged --- */
      const cartDay = () => {
        let d = vm.cart.find((c) => c.date === vm.activeDate);
        if (!d) {
          d = { date: vm.activeDate, menus: [], extras: [] };
          vm.cart.push(d);
          vm.cart.sort((a, b) => a.date.localeCompare(b.date));
        }
        return d;
      };

      stage.addEventListener('click', (ev) => {
        const el = ev.target.closest('[data-day],[data-compose],[data-slot],[data-pick],[data-pick-variation],[data-close-overlay],[data-add],[data-remove],[data-extra],[data-toggle],[data-go],[data-open]');
        if (!el || !vm) return;
        const d = el.dataset;

        if (d.day) {
          vm.activeDate = d.day;
        } else if (d.compose) {
          vm.composer = composedMenu(d.compose === 'new' ? {} : { main: d.compose });
          vm.overlay = 'composer';
        } else if (d.open === 'allergens') {
          vm.overlay = 'allergens';
        } else if (d.pick !== undefined && d.slot) {
          vm.composer[d.slot] = d.pick || null;
          if (d.slot === 'main') vm.composer.variation = null;
          vm.overlay = 'composer';
        } else if (d.pickVariation) {
          vm.composer.variation = d.pickVariation;
          vm.overlay = 'composer';
        } else if (d.slot && el.classList.contains('slot-row')) {
          vm.picker = { slot: d.slot };
          vm.overlay = 'picker';
        } else if (d.add) {
          cartDay().menus.push({ ...vm.composer });
          vm.composer = composedMenu({});
          vm.overlay = null;
        } else if (d.remove !== undefined) {
          const day = vm.cart.find((c) => c.date === vm.activeDate);
          day.menus.splice(Number(d.remove), 1);
          if (!day.menus.length) vm.cart = vm.cart.filter((c) => c !== day);
        } else if (d.extra) {
          const day = cartDay();
          let e = day.extras.find((x) => x.key === d.extra);
          if (!e) day.extras.push((e = { key: d.extra, qty: 0 }));
          e.qty = Math.max(0, e.qty + Number(d.delta));
        } else if (d.toggle === 'summary') {
          vm.summaryOpen = !vm.summaryOpen;
        } else if (d.go) {
          vm.screen = d.go;
          vm.banners = [];
        } else if (d.closeOverlay !== undefined) {
          vm.overlay = vm.overlay === 'picker' ? 'composer' : null;
        }
        render();
      });

      stateSelect.innerHTML = STATES.map(
        (s) => '<option value="' + s.id + '">' + esc(s.label) + '</option>',
      ).join('');
      stateSelect.addEventListener('change', () => loadState(stateSelect.value));

      document.querySelectorAll('.seg button').forEach((b) =>
        b.addEventListener('click', () => {
          view = b.dataset.view;
          document
            .querySelectorAll('.seg button')
            .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          render();
        }),
      );

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 120);
      });

      document
        .querySelectorAll('.seg button')
        .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));

      loadState(currentId);
    </script>
  </body>
</html>
