          '<ellipse cx="6.9" cy="16.6" rx="2" ry="3" transform="rotate(-44 6.9 16.6)"/>',
        /* 12 kén-dioxid — flask */
        '<path d="M9.6 3.4h4.8v4.8l4.6 8.7c.9 1.7-.3 3.7-2.2 3.7H7.2c-1.9 0-3.1-2-2.2-3.7l4.6-8.7z" fill="none" stroke="currentColor" stroke-width="1.5"/>' +
          '<path d="M7.4 13.6h9.2l1.8 3.3c.9 1.7-.3 3.7-2.2 3.7H7.8c-1.9 0-3.1-2-2.2-3.7z"/>' +
          '<path d="M8.8 3.2h6.4" fill="none" stroke="currentColor" stroke-width="1.8"/>',
        /* 13 csillagfürt — lupin spike */
        '<path d="M12 21.4v-6.6" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
          '<circle cx="9.5" cy="13.4" r="1.8"/><circle cx="14.5" cy="13.4" r="1.8"/>' +
          '<circle cx="10.3" cy="9.4" r="1.7"/><circle cx="13.7" cy="9.4" r="1.7"/>' +
          '<circle cx="12" cy="5.6" r="1.6"/>' +
          '<path d="M12 19.6c-2 0-3.5-1.3-3.9-3.1 2.2-.4 3.9.9 3.9 3.1z"/>',
        /* 14 puhatestűek — shell spiral */
        '<path d="M20.4 12c0 4.6-3.8 8.4-8.4 8.4S3.6 16.6 3.6 12 7.2 3.9 11.4 3.9s7.2 3 7.2 6.8c0 3.1-2.5 5.6-5.6 5.6-2.6 0-4.7-2.1-4.7-4.7 0-2.1 1.7-3.8 3.8-3.8 1.7 0 3 1.4 3 3" fill="none" stroke="currentColor" stroke-width="1.6"/>',
      ];

      const allergenGlyph = (code) =>
        '<svg viewBox="0 0 24 24" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
        (ALLERGEN_GLYPHS[code - 1] || '') +
        '</svg>';

      const allergenName = (code) => S.allergens.list[code - 1];
      const allergenTip = (code) => S.allergens.tip(code, allergenName(code));

      /**
       * The chips under a dish name. Three at most, then the rest collapse into one "+N"
       * chip that names them in its own bubble: three is the widest ordinary dish in this
       * week's data, and three 28 px discs are what a 150 px rail card holds on one line
       * without wrapping. The lasagne carries five so the guard is visible somewhere.
       * `scope` only has to make the anchor key unique inside one rendered frame — the
       * same dish appears once in the offer list and once in the main-course picker.
       */
      const A_MAX = 3;
      const allergenCodes = (item, scope) => {
        const all = item.allergens || [];
        if (!all.length) return '';
        const key = (id) => esc((scope || 'list') + ':' + item.id + ':' + id);
        const shown = all.length > A_MAX ? all.slice(0, A_MAX) : all;
        const rest = all.slice(shown.length);
        const chip = (id, label, inner, extra) =>
          '<span class="achip' +
          (extra || '') +
          '" role="button" tabindex="0" data-atip="' +
          key(id) +
          '" aria-label="' +
          esc(label) +
          '"><span class="adisc">' +
          inner +
          '</span></span>';
        return (
          '<span class="achips">' +
          shown.map((a) => chip(a, allergenTip(a), allergenGlyph(a))).join('') +
          (rest.length
            ? chip(
                'more',
                S.allergens.moreLabel(rest.map(allergenTip).join(', ')),
                esc(S.allergens.more(rest.length)),
                ' achip-more',
              )
            : '') +
          '</span>'
        );
      };

      /**
       * The bubble that names an allergen, one per app. It is rendered here rather than
       * next to its chip because every place a chip appears — the dish list, a rail, a
       * sheet — clips its own overflow; the viewer positions it against the frame.
       * `vm.tip` holds the anchor key of a chip so a STATE can capture the bubble open
       * in a still; hovering, focusing and tapping a chip drive the same element live.
       */
      function Tip(vm) {
        const code = vm.tip ? Number(String(vm.tip).split(':').pop()) : 0;
        return code
          ? '<div class="atip" role="tooltip" data-atip-for="' +
              esc(vm.tip) +
              '">' +
              esc(allergenTip(code)) +
              '</div>'
          : '<div class="atip" role="tooltip" hidden></div>';
      }

      /**
       * The tile takes a photo when the item has one; until then, its initial.
       * A null item is a pick that is not a dish — "Nem kérek" — and gets an empty
       * tile: it holds the column so the rows above and below stay aligned, and it
       * reads as an absence instead of claiming an identity the choice does not have.
       */
      const Tile = (item, big) =>
        '<span class="' +
        cls('tile', big && 'tile-lg', !item && 'tile-none') +
        '" aria-hidden="true">' +
        (item ? esc(item.name.replace(/^[0-9. ]+/, '').charAt(0).toUpperCase()) : '') +
        '</span>';

      /* ------------------------------------------------------------------ *
       * 6. COMPONENTS
       * ------------------------------------------------------------------ */
      function Masthead() {
        return (
          '<header class="masthead">' +
          LOGO +
          '<div class="masthead-meta">' +
          esc(S.order.intake) +
          '<br /><a href="tel:+36304901122">' +
          esc(S.order.phone) +
          '</a></div></header>'
        );
      }

      function WeekBar(vm) {
        const first = DAYS[0].date;
        const last = DAYS[DAYS.length - 1].date;
        return (
          '<div class="weekbar"><h1>' +
          esc(S.week.heading) +
          '</h1><div class="week-meta"><span class="week-pill">' +
          esc(S.week.number(WEEK.isoWeek)) +
          '</span><span>' +
          esc(S.week.range(fmt(first, { month: 'long', day: 'numeric' }), dateNum(last) + '.')) +
          '</span><span>' +
          esc(vm.cutoffNote || S.week.cutoffToday) +
          '</span></div><p class="week-terms">' +
          esc(S.order.terms) +
          '</p></div>'
        );
      }

      function DayBar(vm) {
        const items = DAYS.map((d) => {
          const state = vm.dayStates[d.date] || 'open';
          const cartDay = vm.cart.find((c) => c.date === d.date);
          const n = cartDay ? cartDay.menus.length : 0;
          const selected = d.date === vm.activeDate;
          const disabled = state !== 'open';
          return (
            '<li><button type="button" class="day" data-day="' +
            d.date +
            '" role="tab" aria-selected="' +
            selected +
            '"' +
            (disabled
              ? ' disabled title="' +
                esc(state === 'closed' ? S.errors.closedDay : S.days.pastTitle) +
                '"'
              : '') +
            '><span class="dow">' +
            esc(dayShort(d.date)) +
            '</span>' +
            (state === 'closed'
              ? '<span class="dclosed">' + esc(S.days.closed) + '</span>'
              : '<span class="dnum num">' + esc(dateNum(d.date)) + '.</span>') +
            (n
              ? '<span class="dbadge num" title="' + esc(S.days.badgeTitle(n)) + '">' + n + '</span>'
              : '') +
            '</button></li>'
          );
        }).join('');
        return '<nav class="daybar"><ul role="tablist">' + items + '</ul></nav>';
      }

      function Banner(b) {
        return (
          '<div class="banner banner-' +
          b.kind +
          '" role="' +
          (b.kind === 'danger' ? 'alert' : 'status') +
          '"><span class="icon" aria-hidden="true">' +
          (b.kind === 'danger' ? '!' : b.kind === 'ok' ? '✓' : 'i') +
          '</span><div><h3>' +
          esc(b.title) +
          '</h3><p>' +
          esc(b.body) +
          '</p>' +
          (b.items
            ? '<ul>' + b.items.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ul>'
            : '') +
          (b.action
            ? '<p style="margin-top:12px"><button type="button" class="btn btn-secondary btn-sm">' +
              esc(b.action) +
              '</button></p>'
            : '') +
          '</div></div>'
        );
      }

      function Dish(item, date, opts = {}) {
        const soldOut = !!item.soldOut;
        const isSoup = item.cat === 'daily_soup';
        const tappable = opts.action && !soldOut;
        return (
          '<' +
          (tappable ? 'button type="button"' : 'div') +
          ' class="' +
          cls('dish', soldOut && 'is-soldout') +
          '"' +
          (tappable ? ' data-compose="' + item.id + '"' : '') +
          '>' +
          Tile(item) +
          '<span class="dish-body"><span class="dish-name">' +
          esc(item.name) +
          '</span>' +
          (item.desc ? '<span class="dish-desc">' + esc(item.desc) + '</span>' : '') +
          '<span class="dish-meta">' +
          (soldOut ? '<span class="tag tag-soldout">' + esc(S.dish.soldOut) + '</span>' : '') +
          (item.variations
            ? '<span class="tag tag-choice">' +
              esc(S.dish.hasVariations + ': ' + item.variations.join(' · ')) +
              '</span>'
            : '') +
          (item.requiresSide
            ? '<span class="tag tag-choice">' + esc(S.dish.needsSide) + '</span>'
            : '') +
          allergenCodes(item) +
          '</span></span>' +
          '<span class="dish-price num">' +
          (isSoup
            ? money(0) + '<span class="included">' + esc(S.dish.soupIncluded) + '</span>'
            : money(priceOf(item, date)) +
              (!isWeekend(date) && item.priceWeekend !== item.priceWeekday
                ? '<span class="weekend">' +
                  esc(S.dish.weekendPrice(money(item.priceWeekend))) +
                  '</span>'
                : '')) +
          '</span>' +
          '</' +
          (tappable ? 'button' : 'div') +
          '>'
        );
      }

      /** A rail card: price above the name, the way the reference marketplace does it. */
      function RailCard(item, date, opts = {}) {
        const soldOut = !!item.soldOut;
        const tappable = opts.action && !soldOut;
        return (
          '<' +
          (tappable ? 'button type="button"' : 'div') +
          ' class="' +
          cls('rail-card', soldOut && 'is-soldout') +
          '"' +
          (tappable ? ' data-compose="' + item.id + '"' : '') +
          '>' +
          Tile(item, true) +
          '<span class="rc-price num">' +
          money(priceOf(item, date)) +
          '</span><span class="rc-name">' +
          esc(item.name) +
          '</span><span class="rc-meta">' +
          (soldOut ? '<span class="tag tag-soldout">' + esc(S.dish.soldOut) + '</span>' : '') +
          allergenCodes(item) +
          '</span></' +
          (tappable ? 'button' : 'div') +
          '>'
        );
      }

      function Section(title, items, date, opts = {}) {
        if (!items.length) return '';
        const body = opts.rail
          ? '<div class="rail-scroll">' + items.map((i) => RailCard(i, date, opts)).join('') + '</div>'
          : '<div class="dishes">' + items.map((i) => Dish(i, date, opts)).join('') + '</div>';
        return (
          '<section' +
          (opts.sec ? ' data-sec="' + opts.sec + '"' : '') +
          '><div class="section-h"><h2>' +
          esc(title) +
          '</h2>' +
          (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') +
          '</div>' +
          body +
          '</section>'
        );
      }

      function ChipRail(vm) {
        const chips = [
          { sec: '', label: S.sections.all },
          { sec: 'soups', label: S.sections.soups },
          { sec: 'mains', label: S.sections.mains },
          { sec: 'featured', label: S.sections.featured },
          { sec: 'allweek', label: S.sections.allWeek },
          { sec: 'sides', label: S.sections.sideExtras },
          { sec: 'pickles', label: S.sections.pickles },
          { sec: 'desserts', label: S.sections.desserts },
          { sec: 'extras', label: S.sections.extras },
        ];
        return (
          '<div class="chiprail"><div class="chiprail-scroll" role="group" aria-label="' +
          esc(S.sections.jumpLabel) +
          '">' +
          chips
            .map(
              (c) =>
                '<button type="button" class="chip" aria-pressed="' +
                ((vm.activeChip || '') === c.sec) +
                '" data-jump="' +
                c.sec +
                '">' +
                esc(c.label) +
                '</button>',
            )
            .join('') +
          '</div></div>'
        );
      }

      /**
       * One extra, in the two places it appears: a stepper row in the offer list,
       * where it is added, and a priced line in the day's order, where it is
       * checked before paying. Same anatomy and the same strings — the stepper
       * writes the state the cart line reads back, so the two can never disagree.
       */
      function ExtraRow(x, qty, opts = {}) {
        const step = !!opts.stepper;
        return (
          '<div class="' +
          cls('extra', step && qty && 'is-on') +
          '"><span class="name">' +
          esc(step ? x.name : x.name + ' × ' + qty) +
          (step ? '<small>' + esc(S.extras.unitPrice(money(x.price))) + '</small>' : '') +
          '</span>' +
          (step
            ? '<span class="stepper"><button type="button" aria-label="' +
              esc(S.extras.lessOf(x.name)) +
              '" data-extra="' +
              x.key +
              '" data-delta="-1"' +
              (qty ? '' : ' disabled') +
              '>−</button><span class="qty num">' +
              qty +
              '</span><button type="button" aria-label="' +
              esc(S.extras.moreOf(x.name)) +
              '" data-extra="' +
              x.key +
              '" data-delta="1">+</button></span>'
            : '') +
          '<span class="amt num">' +
          (qty ? money(qty * x.price) : '—') +
          '</span></div>'
        );
      }

      /**
       * The extras as a category of their own in the offer list, last — they are
       * things you add on the way out, and they must not compete with today's
       * mains. A vertical list, not a rail: three rows, each carrying two 44 px
       * buttons and two prices, do not fit a 150 px card, and a rail card whose
       * whole surface is the tap target cannot hold controls of its own.
       * They belong to the day whose tab is active, exactly like the menus do.
       */
      function ExtrasSection(vm) {
        const day = vm.cart.find((c) => c.date === vm.activeDate);
        const qtyOf = (key) =>
          (((day && day.extras) || []).find((e) => e.key === key) || {}).qty || 0;
        return (
          '<section data-sec="extras"><div class="section-h"><h2>' +
          esc(S.sections.extras) +
          '</h2><span class="hint">' +
          esc(S.extras.hint) +
          '</span></div><div class="extra-list">' +
          CFG.extras.map((x) => ExtraRow(x, qtyOf(x.key), { stepper: true })).join('') +
          '</div></section>'
        );
      }

      function CartCard(vm) {
        const day = vm.cart.find((c) => c.date === vm.activeDate);
        const priced = day ? priceDay(day) : null;
        const head =
          '<div class="card-head"><h2>' +
          esc(S.cart.title) +
          '</h2><span class="count">' +
          esc(cap(dayFull(vm.activeDate))) +
          '</span></div>';

        // Extras can now be added from the offer list without a menu, so "empty"
        // means neither — a day carrying two breads is not an empty day, and the
        // card must not hide the lines that the food subtotal is counting.
        const empty =
          '<div class="cart-empty"><p><b>' +
          esc(S.cart.empty) +
          '</b></p><p>' +
          esc(S.cart.emptyCta) +
          '</p></div>';
        if (!priced || (!priced.menus.length && !priced.extras.length)) {
          return '<div class="card">' + head + empty + '</div>';
        }

        const menus = priced.menus
          .map((m, idx) => {
            const lines = m.price.lines
              .map(
                (l) =>
                  '<div class="' +
                  cls('cart-line', l.adj && 'adj') +
                  '"><span class="slot">' +
                  esc(l.slot || '') +
                  '</span><span class="what">' +
                  esc(l.what) +
                  '</span><span class="amt num">' +
                  (l.adj ? signed(l.amount) : money(l.amount)) +
                  '</span></div>',
              )
              .join('');
            return (
              '<div class="cart-menu"><div class="cart-who">' +
              esc(S.cart.menuNumber(idx + 1)) +
              '</div><div class="cart-lines">' +
              lines +
              '</div><div class="cart-menu-total"><span>' +
              esc(S.composer.priceTotal) +
              '</span><span class="amt num">' +
              money(m.price.total) +
              '</span></div><div class="cart-actions"><button type="button" class="btn-quiet" data-edit="' +
              idx +
              '">' +
              esc(S.cart.edit) +
              '</button><button type="button" class="btn-danger" data-remove="' +
              idx +
              '">' +
              esc(S.cart.remove) +
              '</button></div></div>'
            );
          })
          .join('');

        // The day's order is a receipt: composed menus appear here as priced lines
        // with an edit button, not as editable forms. The extras now follow the
        // same rule — they are added in their own section of the offer list, and
        // this block states what that came to and offers the way back to it. One
        // stepper per value: on desktop the rail and the offer list are on screen
        // at the same time, and two live steppers for one number read as two
        // features.
        const extras = priced.extras.length
          ? '<div class="extras"><div class="section-h"><h2 style="font-size:var(--t-base)">' +
            esc(S.extras.title) +
            '</h2></div>' +
            priced.extras.map((x) => ExtraRow(x, x.qty)).join('') +
            '<div class="cart-actions"><button type="button" class="btn-quiet" data-jump="extras">' +
            esc(S.extras.change) +
            '</button></div></div>'
          : '';

        return (
          '<div class="card">' +
          head +
          (priced.menus.length ? menus : empty) +
          extras +
          '<div class="card-body" style="border-top:1px solid var(--line);display:flex;gap:12px;font-weight:700"><span>' +
          esc(S.cart.foodSubtotal) +
          '</span><span class="num" style="margin-left:auto">' +
          money(priced.food) +
          '</span></div>' +
          '<div class="card-body" style="border-top:1px solid var(--line)"><button type="button" class="btn btn-secondary btn-block" data-compose="new">' +
          esc(S.cart.addAnother) +
          '</button></div></div>'
        );
      }

      function Totals(cart, opts = {}) {
        const p = priceCart(cart);
        if (!p.days.length) {
          return (
            '<div class="totals"><p><b>' +
            esc(S.summary.empty) +
            '</b></p><p style="color:var(--ink-500);font-size:var(--t-md)">' +
            esc(S.summary.emptyHint) +
            '</p></div>'
          );
        }
        const blocks = p.days
          .map(
            (d) =>
              '<div class="day-block"><div class="dh">' +
              esc(cap(dayFull(d.date))) +
              '</div><div class="row"><span class="what">' +
              esc(S.summary.food) +
              '</span><span class="amt num">' +
              money(d.food) +
              '</span></div><div class="row fee"><span class="what">' +
              esc(S.summary.deliveryFee) +
              '</span><span class="amt num">' +
              money(d.fee) +
              '</span></div>' +
              (d.missing > 0
                ? '<div class="row" style="color:var(--warn-700);font-weight:600"><span class="what">' +
                  esc(S.summary.minimumWarning(cap(dayLong(d.date)), money(d.missing))) +
                  '</span></div>'
                : '') +
              '</div>',
          )
          .join('<div class="sep"></div>');
        return (
          '<div class="totals">' +
          blocks +
          '<div class="grand"><span>' +
          esc(S.summary.grandTotal) +
          '</span><span class="amt num">' +
          money(p.grand) +
          '</span></div>' +
          (opts.feeNote
            ? '<p style="font-size:var(--t-sm);color:var(--ink-500)">' + esc(S.summary.feeNote) + '</p>'
            : '') +
          '</div>'
        );
      }

      function SummaryBar(vm, variant) {
        const p = priceCart(vm.cart);
        const blocked = p.belowMinimum.length > 0;
        const open = variant === 'desktop' ? true : vm.summaryOpen;
        const dayNames = p.belowMinimum.map((d) => dayLong(d.date)).join(', ');
        const header =
          variant === 'desktop'
            ? '<div class="line"><span class="total">' + esc(S.summary.title) + '</span></div>'
            : '<div class="line"><div><div class="what">' +
              esc(
                p.days.length
                  ? S.summary.barMenus(p.menuCount) + ' · ' + S.summary.barDays(p.days.length)
                  : S.summary.empty,
              ) +
              '</div><div class="total num">' +
              money(p.grand) +
              '</div></div><button type="button" class="toggle" data-toggle="summary">' +
              esc(open ? S.summary.hideDetails : S.summary.details) +
              '</button></div>';
        return (
          '<div class="' +
          cls('sumbar', variant === 'desktop' ? 'only-desktop' : 'only-mobile') +
          '">' +
          header +
          (open ? '<div class="detail">' + Totals(vm.cart, { feeNote: true }) + '</div>' : '') +
          (blocked
            ? '<div class="banner banner-warn" role="status"><span class="icon" aria-hidden="true">!</span><div><p>' +
              esc(S.summary.minimumBlocked(dayNames)) +
              '</p></div></div>'
            : '') +
          '<button type="button" class="btn btn-primary btn-block"' +
          (blocked || !p.days.length ? ' aria-disabled="true" disabled' : ' data-go="checkout"') +
          '>' +
          esc(S.summary.continue) +
          '</button></div>'
        );
      }

      /* --- overlays ------------------------------------------------------- */
      function Sheet(title, sub, body, foot) {
        return (
          '<div class="overlay" data-close-overlay><div class="sheet" role="dialog" aria-modal="true" aria-label="' +
          esc(title) +
          '"><div class="sheet-head"><div class="titles"><h2>' +
          esc(title) +
          '</h2>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
          '</div><button type="button" class="sheet-close" aria-label="' +
          esc(S.common.close) +
          '" data-close-overlay>×</button></div><div class="sheet-body">' +
          body +
          '</div>' +
          (foot ? '<div class="sheet-foot">' + foot + '</div>' : '') +
          '</div></div>'
        );
      }

      function slotOptions(slot, date) {
        const d = WEEK.byDate[date];
        if (slot === 'soup') return [{ items: d.soups }];
        if (slot === 'main')
          return [
            { label: S.sections.mains, items: d.mains },
            { label: S.sections.featured, items: WEEK.featured },
            { label: S.sections.allWeek, items: WEEK.allWeek },
          ];
        if (slot === 'side')
          return [
            { label: S.sections.sides, items: WEEK.sides },
            { label: S.sections.sideExtras, items: WEEK.sideExtras },
          ];
        if (slot === 'pickle') return [{ items: WEEK.pickles }];
        return [{ items: WEEK.desserts }];
      }

      function ComposerForm(vm) {
        const c = vm.composer;
        const date = vm.activeDate;
        const p = priceMenu(c, date);
        const mainItem = c.main ? ITEMS[c.main] : null;
        const needsVariation = !!(mainItem && mainItem.variations);
        const needsSide = !!(mainItem && mainItem.requiresSide);
        const portions = c.portions || 1;

        const slotRow = (slot, opts = {}) => {
          const item = c[slot] ? ITEMS[c[slot]] : null;
          const missing = opts.required && !item;
          const amountLine = p.lines.find((l) => l.slot === S.composer.slots[slot]);
          let amt = '';
          if (item) {
            if (slot === 'soup') {
              const surcharge = p.lines.find((l) => l.adj && l.amount > 0);
              amt = surcharge ? signed(surcharge.amount) : money(0);
            } else {
              amt = money(amountLine ? amountLine.amount : 0);
            }
          }
          return (
            '<button type="button" class="' +
            cls('slot-row', missing && 'is-required') +
            '" data-slot="' +
            slot +
            '"><span class="label">' +
            esc(S.composer.slots[slot]) +
            '</span><span class="value">' +
            (item
              ? '<span class="picked">' + esc(item.name) + '</span>'
              : '<span class="placeholder">' +
                esc(opts.required ? S.composer.choose : S.composer.none) +
                '</span>') +
            '</span><span class="amt num">' +
            esc(amt) +
            '</span><span class="chev" aria-hidden="true">›</span></button>'
          );
        };

        /**
         * Inline choice rows: one tap, no nested sheet, every option's price effect
         * visible at once. Used where the whole option list fits — soup (2 options,
         * and it drives both price adjustments), the variation, and the side (7, and
         * the only required slot). Main keeps the row + picker because it has 11
         * options across three categories; pickle and dessert keep theirs to stay
         * quiet and keep the sheet short, but either becomes rows with one more
         * choiceRows() call.
         * The figure under an option's name is what that choice does to the menu
         * total — for soup that is the −100 / +650 adjustment itself, which is the
         * price the old system hid until after you had chosen.
         * Every option is rendered; the block never scrolls on its own. Seven side
         * rows make a tall block, but a scroller inside the scrolling sheet would
         * hide the very options that are the usual reason the add button is disabled.
         * noTile drops the tile for the variation block: a variation is a property of
         * the main course above it, not a dish of its own, and "Csirkemell" and
         * "Csirkecomb" would both draw a C.
         */
        const choiceRows = (slotLabel, opts) => {
          const label = opts.required ? slotLabel + ' · ' + S.composer.requiredSuffix : slotLabel;
          const rows = opts.options
            .map((o) => {
              const item = o.id ? ITEMS[o.id] : null;
              const checked = (o.id || null) === (c[opts.slot] || null);
              const soldOut = !!(item && item.soldOut);
              return (
                '<button type="button" class="pickrow choicerow" role="radio" aria-checked="' +
                checked +
                '"' +
                (soldOut ? ' aria-disabled="true" disabled' : '') +
                ' data-pick="' +
                esc(o.id || '') +
                '" data-slot="' +
                opts.slot +
                '">' +
                (opts.noTile ? '' : Tile(item)) +
                '<span class="pbody"><span class="pname">' +
                esc(o.name) +
                (soldOut ? ' <span class="tag tag-soldout">' + esc(S.dish.soldOut) + '</span>' : '') +
                '</span><span class="pamt num">' +
                esc(o.amount) +
                '</span></span><span class="pmark" aria-hidden="true">✓</span></button>'
              );
            })
            .join('');
          return (
            '<div><p class="' +
            cls('field-label', opts.required && 'is-required') +
            '">' +
            esc(label) +
            '</p>' +
            (opts.hint ? '<p class="extra-note" style="margin-top:calc(var(--s-2) * -1)">' + esc(opts.hint) + '</p>' : '') +
            '<div class="choicerows" role="radiogroup" aria-label="' +
            esc(S.composer.slots[opts.slot] || label) +
            '">' +
            rows +
            '</div></div>'
          );
        };

        /** What the receipt would say if this soup (or none) were chosen. */
        const soupAmount = (id) => {
          const adj = priceMenu({ ...c, soup: id }, date).lines.find((l) => l.adj);
          return adj ? signed(adj.amount) : money(0);
        };

        const soupBlock = choiceRows(S.composer.slots.soup, {
          slot: 'soup',
          hint: mainItem ? null : S.sections.soupsHint,
          options: [
            { id: null, name: S.composer.none, amount: soupAmount(null) },
            ...WEEK.byDate[date].soups.map((s) => ({
              id: s.id,
              name: s.name,
              amount: soupAmount(s.id),
            })),
          ],
        });

        const sideBlock = needsSide
          ? choiceRows(S.composer.slots.side, {
              slot: 'side',
              required: !c.side,
              options: [...WEEK.sides, ...WEEK.sideExtras].map((i) => ({
                id: i.id,
                name: i.name,
                amount: money(priceOf(i, date)),
              })),
            })
          : '';

        const variationBlock = needsVariation
          ? choiceRows(S.composer.variationLabel, {
              slot: 'variation',
              noTile: true,
              required: !c.variation,
              options: mainItem.variations.map((v) => ({
                id: v,
                name: v,
                amount: money(priceOf(mainItem, date)),
              })),
            })
          : '';

        const priceRows = p.lines
          .map(
            (l) =>
              '<div class="' +
              cls('row', l.adj && 'adj') +
              '"><span>' +
              esc(l.what) +
              '</span><span class="amt num">' +
              (l.amount === 0 ? (l.note ? esc(l.note) : money(0)) : l.adj ? signed(l.amount) : money(l.amount)) +
              '</span></div>' +
              (l.why ? '<div class="why">' + esc(l.why) + '</div>' : ''),
          )
          .join('');

        /**
         * Step 2 offers the things you eat *alongside* the lunch. Two of them are menu
         * slots (dessert, pickle); sauce and bread are day-level extras with a quantity,
         * so they are held here and merged into the day when the menu is added. The box
         * is not here: it is packaging, and it belongs to the day, not to a plate.
         */
        const MEAL_EXTRAS = ['sauce', 'bread'];
        const pendingExtras = c.extras || {};
        const mealExtras = CFG.extras.filter((x) => MEAL_EXTRAS.includes(x.key));
        const extrasTotal = mealExtras.reduce(
          (sum, x) => sum + (pendingExtras[x.key] || 0) * x.price,
          0,
        );

        const mealExtraRow = (x) => {
          const qty = pendingExtras[x.key] || 0;
          return (
            '<div class="' +
            cls('pickrow choicerow', qty && 'is-on') +
            '">' +
            Tile(x) +
            '<span class="pbody"><span class="pname">' +
            esc(x.name) +
            '</span><span class="pamt num">' +
            esc(S.extras.unitPrice(money(x.price))) +
            '</span></span><span class="stepper"><button type="button" aria-label="' +
            esc(S.extras.lessOf(x.name)) +
            '" data-mealextra="' +
            x.key +
            '" data-delta="-1"' +
            (qty ? '' : ' disabled') +
            '>−</button><span class="qty num">' +
            qty +
            '</span><button type="button" aria-label="' +
            esc(S.extras.moreOf(x.name)) +
            '" data-mealextra="' +
            x.key +
            '" data-delta="1">+</button></span></div>'
          );
        };
        /**
         * The form is the screen, not a modal: it opens empty for the next menu and
         * every choice is on the page. The offer list below is the same catalogue —
         * tapping a dish there drops it into this form — so there are two ways in and
         * only one place where a menu is built.
         */
        const body =
          '<div class="slots">' +
          slotRow('main') +
          '</div>' +
          variationBlock +
          soupBlock +
          sideBlock +
          choiceRows(S.composer.slots.dessert, {
            slot: 'dessert',
            options: [
              { id: null, name: S.composer.none, amount: money(0) },
              ...WEEK.desserts.map((i) => ({
                id: i.id,
                name: i.name,
                amount: money(priceOf(i, date)),
              })),
            ],
          }) +
          choiceRows(S.composer.slots.pickle, {
            slot: 'pickle',
            options: [
              { id: null, name: S.composer.none, amount: money(0) },
              ...WEEK.pickles.map((i) => ({
                id: i.id,
                name: i.name,
                amount: money(priceOf(i, date)),
              })),
            ],
          }) +
          '<div><p class="field-label">' +
          esc(S.composer.mealExtras) +
          '</p><div class="choicerows">' +
          mealExtras.map(mealExtraRow).join('') +
          '</div><p class="extra-note">' +
          esc(S.composer.mealExtrasHint) +
          '</p></div>' +
          (p.lines.length || extrasTotal
            ? '<div class="pricebox">' +
              priceRows +
              '<div class="row total"><span>' +
              esc(S.composer.priceTotal) +
              '</span><span class="amt num">' +
              money(p.total) +
              '</span></div>' +
              (extrasTotal
                ? '<div class="row" style="margin-top:var(--s-2)"><span>' +
                  esc(S.composer.extrasSubtotal) +
                  '</span><span class="amt num">' +
                  money(extrasTotal) +
                  '</span></div>'
                : '') +
              '</div>'
            : '') +
          (portions > 1 ? '<p class="help">' + esc(S.composer.portionsHelp) + '</p>' : '');

        const invalid = p.errors.length > 0;
        const empty = p.errors.includes('empty') && !extrasTotal;
        const errorText = p.errors.includes('variation')
          ? S.composer.variationMissing
          : p.errors.includes('side')
            ? S.composer.sideMissing
            : S.composer.emptyMenu;

        const addTotal = (p.total + extrasTotal) * portions;
        const foot =
          '<div class="foot-top"><span class="foot-price num">' +
          money(addTotal) +
          (portions > 1
            ? '<small>' + esc(money(p.total + extrasTotal) + ' × ' + portions) + '</small>'
            : '') +
          '</span><span class="stepper"><button type="button" aria-label="' +
          esc(S.extras.less) +
          '" data-portions="-1"' +
          (portions > 1 ? '' : ' disabled') +
          '>−</button><span class="qty num">' +
          portions +
          ' ' +
          esc(S.composer.portions) +
          '</span><button type="button" aria-label="' +
          esc(S.extras.more) +
          '" data-portions="1">+</button></span></div>' +
          (invalid && !empty ? '<p class="error">' + esc(errorText) + '</p>' : '') +
          '<div class="foot-actions">' +
          (empty
            ? ''
            : '<button type="button" class="btn btn-ghost" data-reset="1">' +
              esc(S.composer.reset) +
              '</button>') +
          '<button type="button" class="btn btn-primary"' +
          (invalid ? ' aria-disabled="true" disabled' : ' data-add="1"') +
          '>' +
          esc(portions > 1 ? S.composer.addMany(portions) : S.composer.add) +
          '</button></div>';

        const menuNo = (vm.cart.find((d) => d.date === date) || { menus: [] }).menus.length + 1;
        return (
          '<section class="composer-form" data-sec="compose"><div class="cf-head"><h2>' +
          esc(S.composer.formTitle(menuNo)) +
          '</h2><p class="hint">' +
          esc(S.composer.formHint) +
          '</p></div><div class="cf-body">' +
          body +
          '</div><div class="cf-foot">' +
          foot +
          '</div></section>'
        );
      }

      function PickerSheet(vm) {
        const slot = vm.picker.slot;
        const date = vm.activeDate;
        const c = vm.composer;

        const groups = slotOptions(slot, date);
        const none =
          '<button type="button" class="pickrow option" role="radio" aria-checked="' +
          !c[slot] +
          '" data-pick="" data-slot="' +
          slot +
          '">' +
          Tile(null) +
          '<span class="pbody"><span class="pname">' +
          esc(S.composer.none) +
          '</span></span><span class="pmark" aria-hidden="true">✓</span></button>';

        const body = groups
          .map(
            (g) =>
              (g.label ? '<div class="opt-group">' + esc(g.label) + '</div>' : '') +
              g.items
                .map((it) => {
                  const soldOut = !!it.soldOut;
                  const amount =
                    it.cat === 'daily_soup'
                      ? c.main && ITEMS[c.main].soupIncluded
                        ? S.dish.soupIncluded
                        : signed(CFG.pricing.soupPrice)
                      : priceOf(it, date) === 0
                        ? money(0)
                        : money(priceOf(it, date));
                  return (
                    '<button type="button" class="pickrow option" role="radio" aria-checked="' +
                    (c[slot] === it.id) +
                    '"' +
                    (soldOut ? ' aria-disabled="true" disabled' : '') +
                    ' data-pick="' +
                    it.id +
                    '" data-slot="' +
                    slot +
                    '">' +
                    Tile(it) +
                    '<span class="pbody"><span class="pname">' +
                    esc(it.name) +
                    (soldOut ? ' <span class="tag tag-soldout">' + esc(S.dish.soldOut) + '</span>' : '') +
                    '</span><span class="pamt num">' +
                    esc(amount) +
                    '</span>' +
                    (it.desc || (it.allergens && it.allergens.length)
                      ? '<span class="psub">' +
                        esc(it.desc || '') +
                        allergenCodes(it, 'pick') +
                        '</span>'
                      : '') +
                    '</span><span class="pmark" aria-hidden="true">✓</span></button>'
                  );
                })
                .join(''),
          )
          .join('');

        return Sheet(
          S.composer.pickerTitle(S.composer.slots[slot]),
          cap(dayFull(date)),
          '<div class="options" role="radiogroup">' + none + body + '</div>',
          '',
        );
      }

      /* The legend now carries the pictogram next to the number and the name, so the
         sheet teaches the chips and the chips point back at the sheet. */
      function AllergenSheet() {
        const list = S.allergens.list
          .map(
            (name, i) =>
              '<div class="alist-row"><span class="achip" aria-hidden="true"><span class="adisc">' +
              allergenGlyph(i + 1) +
              '</span></span><span class="num">' +
              (i + 1) +
              '</span><span class="what">' +
              esc(name) +
              '</span></div>',
          )
          .join('');
        return Sheet(
          S.allergens.title,
          '',
          '<p style="font-size:var(--t-md);line-height:1.6">' +
            esc(S.allergens.notice) +
            '</p><div class="card"><div class="card-body"><div class="alist">' +
            list +
            '</div></div></div>',
          '<button type="button" class="btn btn-ghost btn-block" data-close-overlay>' +
            esc(S.common.close) +
            '</button>',
        );
      }

      /* --- screens --------------------------------------------------------- */
      function MenuScreen(vm) {
        const d = WEEK.byDate[vm.activeDate];
        const date = vm.activeDate;
        const offer =
          ChipRail(vm) +
          Section(S.sections.soups, d.soups, date, {
            sec: 'soups',
            action: true,
            hint: S.sections.soupsHint,
          }) +
          Section(S.sections.mains, d.mains, date, { sec: 'mains', action: true }) +
          Section(S.sections.featured, WEEK.featured, date, {
            sec: 'featured',
            action: true,
            rail: true,
            hint: S.sections.weekendHint,
          }) +
          Section(S.sections.allWeek, WEEK.allWeek, date, {
            sec: 'allweek',
            action: true,
            rail: true,
          }) +
          Section(S.sections.sideExtras, WEEK.sideExtras, date, { sec: 'sides', rail: true }) +
          Section(S.sections.pickles, WEEK.pickles, date, { sec: 'pickles', rail: true }) +
          Section(S.sections.desserts, WEEK.desserts, date, { sec: 'desserts', rail: true }) +
          ExtrasSection(vm) +
          '<div class="allergen-note"><span aria-hidden="true">⚠</span><p>' +
          esc(S.allergens.notice) +
          ' <button type="button" data-open="allergens">' +
          esc(S.allergens.link) +
          '</button></p></div>';

        return (
          '<div class="screen">' +
          '<div class="banners">' +
          (vm.banners || []).map(Banner).join('') +
          '</div>' +
          ComposerForm(vm) +
          '<div class="rail">' +
          CartCard(vm) +
          SummaryBar(vm, 'desktop') +
          '</div>' +
          '<div class="col-main">' +
          offer +
          '</div>' +
          '</div>' +
          SummaryBar(vm, 'mobile')
        );
      }

      function OrderRecap(cart) {
        const p = priceCart(cart);
        return p.days
          .map(
            (d) =>
              '<div class="card"><div class="card-head"><h2>' +
              esc(cap(dayFull(d.date))) +
              '</h2><span class="count num">' +
              money(d.total) +
              '</span></div>' +
              d.menus
                .map(
                  (m, i) =>
                    '<div class="cart-menu"><div class="cart-who">' +
                    esc(S.cart.menuNumber(i + 1)) +
                    '</div><div class="amt num" style="font-weight:700">' +
                    money(m.price.total) +
                    '</div><div class="cart-lines">' +
                    m.price.lines
                      .filter((l) => !l.adj)
                      .map(
                        (l) =>
                          '<div class="cart-line"><span class="slot">' +
                          esc(l.slot || '') +
                          '</span><span class="what">' +
                          esc(l.what) +
                          '</span></div>',
                      )
                      .join('') +
                    '</div></div>',
                )
                .join('') +
              (d.extras.length
                ? '<div class="extras">' +
                  d.extras
                    .map(
                      (e) =>
                        '<div class="extra"><span class="name">' +
                        esc(e.name) +
                        ' × ' +
                        e.qty +
                        '</span><span class="amt num">' +
                        money(e.amount) +
                        '</span></div>',
                    )
                    .join('') +
                  '</div>'
                : '') +
              '<div class="card-body" style="border-top:1px solid var(--line)"><div class="totals"><div class="row"><span class="what">' +
              esc(S.summary.food) +
              '</span><span class="amt num">' +
              money(d.food) +
              '</span></div><div class="row fee"><span class="what">' +
              esc(S.summary.deliveryFee) +
              '</span><span class="amt num">' +
              money(d.fee) +
              '</span></div></div></div></div>',
          )
          .join('');
      }

      function CheckoutScreen(vm) {
        const v = vm.checkout.values;
        const e = vm.checkout.errors || {};
        const field = (key, label, opts = {}) => {
          const tag = opts.textarea ? 'textarea' : 'input';
          return (
            '<div class="' +
            cls('field', e[key] && 'has-error') +
            '"><label for="f-' +
            key +
            '">' +
            esc(label) +
            (opts.optional ? '' : ' <span class="req" aria-hidden="true">*</span>') +
            '</label><' +
            tag +
            ' class="control" id="f-' +
            key +
            '"' +
            (opts.type ? ' type="' + opts.type + '"' : '') +
            (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') +
            (e[key] ? ' aria-invalid="true"' : '') +
            (opts.textarea ? '>' + esc(v[key] || '') + '</textarea>' : ' value="' + esc(v[key] || '') + '" />') +
            (e[key] ? '<p class="error">' + esc(e[key]) + '</p>' : '') +
            (opts.help ? '<p class="help">' + esc(opts.help) + '</p>' : '') +
            '</div>'
          );
        };

        const p = priceCart(vm.cart);
        const summary =
          '<div class="rail"><div class="cartsum"><p class="eyebrow">' +
          esc(S.checkout.cartValue) +
          '</p><p class="cartsum-total num">' +
          money(p.grand) +
          '</p>' +
          OrderRecap(vm.cart) +
          '<div class="cartsum-totals">' +
          Totals(vm.cart, { feeNote: true }) +
          '</div></div></div>';

        return (
          '<div class="screen">' +
          '<div class="col-main">' +
          '<button type="button" class="btn-quiet" data-go="menu" style="align-self:flex-start">‹ ' +
          esc(S.checkout.back) +
          '</button>' +
          '<h1 style="font-family:var(--font-display);font-weight:500;font-size:var(--t-2xl)">' +
          esc(S.checkout.title) +
          '</h1>' +
          (vm.banners || []).map(Banner).join('') +
          (Object.keys(e).length
            ? Banner({ kind: 'danger', title: S.checkout.errors.summary, body: '' })
            : '') +
          '<div class="card"><div class="card-head"><h2>' +
          esc(S.checkout.contact) +
          '</h2></div><div class="card-body"><div class="fields">' +
          field('name', S.checkout.name, { placeholder: S.checkout.namePlaceholder }) +
          field('phone', S.checkout.phone, {
            type: 'tel',
            placeholder: S.checkout.phonePlaceholder,
            help: S.checkout.phoneHelp,
          }) +
          field('email', S.checkout.email, { type: 'email', help: S.checkout.emailHelp }) +
          field('address', S.checkout.address, {
            placeholder: S.checkout.addressPlaceholder,
            help: S.checkout.addressHelp,
          }) +
          field('note', S.checkout.note, {
            optional: true,
            textarea: true,
            placeholder: S.checkout.notePlaceholder,
          }) +
          '</div></div></div>' +
          '<p style="font-size:var(--t-md);color:var(--ink-700)">' +
          esc(S.checkout.payment) +
          '</p>' +
          '<button type="button" class="btn btn-primary btn-block"' +
          (vm.checkout.submitting ? ' aria-disabled="true" disabled' : '') +
          '>' +
          (vm.checkout.submitting
            ? '<span class="spinner" aria-hidden="true"></span>' + esc(S.checkout.submitting)
            : esc(S.checkout.submit)) +
          '</button>' +
          '</div>' +
          summary +
          '</div>'
        );
      }

          '</h1><p class="lead">' +

          '</p>' +
          '<div class="section-h"><h2>' +
          esc(S.success.daysTitle) +
          '</h2></div>' +
          p.days
            .map(
              (d, i) =>
                '<div class="card"><div class="card-head"><h2>' +
                esc(cap(dayFull(d.date))) +
                '</h2><span class="count num">' +
                money(d.total) +
                '</span></div><div class="card-body"><div class="cart-lines">' +
                d.menus
                  .map(
                    (m, k) =>
                      '<div class="cart-line"><span class="slot">' +
                      esc(S.cart.menuNumber(k + 1)) +
                      '</span><span class="what">' +
                      esc(

                          .join(', '),
                      ) +
                      '</span><span class="amt num">' +
                      money(m.price.total) +
                      '</span></div>',

                  .join('') +
                d.extras
                  .map(
                    (x) =>

          STATES.length +
          ' állapot mobilnézetben. Válassz egy állapotot fent a részletes nézethez.</p>' +
          '<div class="gallery-grid" style="grid-template-columns:repeat(auto-fill,200px)">' +
          cards +
          '</div>';
        syncTips(true);
      }

      function render() {
        if (view === 'all') return renderGallery();
        const state = STATES.find((s) => s.id === currentId);
        const markup = App(vm);
        const avail = stage.clientWidth || 1000;
        let mS = 1;
        let dS = 1;
        if (view === 'mobile') {
          mS = Math.min(1, avail / MOBILE.w);
        } else if (view === 'desktop') {
          dS = Math.min(1, avail / DESKTOP.w);
        } else {
          mS = Math.min(1, avail / MOBILE.w);
          const rest = avail - MOBILE.w * mS - 40;
          dS = rest >= 360 ? Math.min(1, rest / DESKTOP.w) : Math.min(1, avail / DESKTOP.w);
        }
        const frames =
          (view !== 'desktop' ? frame(MOBILE, mS, markup) : '') +
          (view !== 'mobile' ? frame(DESKTOP, dS, markup) : '');
        stage.innerHTML =
          '<p class="state-note">' +
          state.note +
          '</p><div class="devices">' +
          frames +
          '</div>';
        syncTips(true);
      }

      function loadState(id) {
        const state = STATES.find((s) => s.id === id) || STATES[0];
        currentId = state.id;
        vm = state.vm();
        stateSelect.value = currentId;
        if (location.hash.slice(1) !== currentId) history.replaceState(null, '', '#' + currentId);
        render();
      }

      /* --- the allergen bubble ------------------------------------------------
         Positioned by measurement, not by CSS: .dishes, .rail-scroll and the sheet
         body all clip their overflow, so the bubble cannot be a child of the chip's
         row. It is one fixed element per app, and inside a device frame — which is
         transformed and is a container-query root — "fixed" resolves against the
         frame. So the maths is: the chip's page rect minus the frame's page rect,
         divided by the frame's scale. It flips above/below and clamps to the frame,
         which is what makes a row at the very top and one behind the sticky summary
         bar both work. Hovering and focusing move this element directly instead of
         re-rendering: render() rewrites the frame and would throw away the scroll
         position, which on a hover is unforgivable. */
      const tipAnchor = (t) => (t && t.closest ? t.closest('[data-atip]') : null);

      function hideTips(root) {
        (root || document).querySelectorAll('.atip').forEach((tip) => {
          tip.classList.remove('is-open');
          tip.hidden = true;
          tip.removeAttribute('data-atip-for');
        });
        (root || document)
          .querySelectorAll('[data-tipopen]')
          .forEach((c) => c.removeAttribute('data-tipopen'));
      }

      function placeTip(chip) {
        const frame = chip.closest('.device');
        const tip = frame && frame.querySelector('.atip');
        if (!tip) return;
        hideTips(frame);
        tip.textContent = chip.getAttribute('aria-label') || '';
        tip.dataset.atipFor = chip.dataset.atip;
        tip.hidden = false;
        tip.classList.remove('is-below');

        const fr = frame.getBoundingClientRect();
        const scale = fr.width / frame.offsetWidth || 1;
        const cr = chip.getBoundingClientRect();
        const fw = frame.clientWidth;
        const fh = frame.clientHeight;
        const cx = (cr.left + cr.width / 2 - fr.left) / scale;
        const cTop = (cr.top - fr.top) / scale;
        const cBottom = (cr.bottom - fr.top) / scale;
        /* The band the bubble may occupy is not the whole frame: the masthead, the day
           rail and the category chips are opaque and brand-coloured — a brown bubble on
           the brown masthead is invisible — and the summary bar is the one control that
           must never be covered. So the band is measured from those elements, counting
           the sticky ones only while they are actually stuck. */
        let safeTop = 8;
        let safeBottom = fh - 8;
        frame.querySelectorAll('.masthead, .daybar, .chiprail').forEach((el) => {
          const r = el.getBoundingClientRect();
          if (!r.height) return;
          const y = (r.top - fr.top) / scale;
          if (y <= (parseFloat(getComputedStyle(el).top) || 0) + 1)
            safeTop = Math.max(safeTop, y + r.height / scale + 4);
        });
        const bar = frame.querySelector('.app > .sumbar');
        if (bar && bar.getBoundingClientRect().height)
          safeBottom = Math.min(safeBottom, (bar.getBoundingClientRect().top - fr.top) / scale - 4);

        /* Nothing to point at — scrolled away, or behind that same chrome. */
        if (cBottom < safeTop || cTop > safeBottom) {
          hideTips(frame);
          return;
        }
        const tw = tip.offsetWidth;
        const th = tip.offsetHeight;

        let top = cTop - th - 1;
        let below = false;
        if (top < safeTop) {
          top = cBottom + 1;
          below = true;
        }
        if (below && top + th > safeBottom) {
          top = Math.max(safeTop, Math.min(cTop - th - 1, safeBottom - th));
          below = false;
        }
        const left = Math.max(8, Math.min(Math.round(cx - tw / 2), fw - tw - 8));
        tip.classList.toggle('is-below', below);
        /* Everything above is measured against the *visible* frame, which is what the
           flip and the clamp have to obey. What gets written is offset by the frame's
           scroll: with a transformed containing block "fixed" is resolved like
           "absolute", so the coordinates are content coordinates, not viewport ones. */
        tip.style.left = left + frame.scrollLeft + 'px';
        tip.style.top = Math.round(top) + frame.scrollTop + 'px';
        tip.style.setProperty('--ax', Math.max(12, Math.min(tw - 12, Math.round(cx - left))) + 'px');
        tip.classList.add('is-open');
        chip.setAttribute('data-tipopen', '');
      }

      /* A state can hold a bubble open (vm.tip) so the behaviour is reviewable in a
         still; App renders it and this puts it where its chip is. With `reveal` the
         frame is scrolled to its chip first — a state that documents the bubble has to
         show it whichever row it hangs off. Called again on every scroll, so an open
         bubble follows its chip instead of floating where the chip used to be. */
      function syncTips(reveal) {
        document.querySelectorAll('.device .atip[data-atip-for]').forEach((tip) => {
          const frame = tip.closest('.device');
          const chip = frame.querySelector('[data-atip="' + tip.dataset.atipFor + '"]');
          if (!chip) {
            tip.hidden = true;
            return;
          }
          /* Not while a sheet is open: the sheet is anchored to the frame the same way
             the bubble is, so scrolling the frame under it would drag the sheet along. */
          if (reveal && !frame.querySelector('.overlay')) {
            const fr = frame.getBoundingClientRect();
            const scale = fr.width / frame.offsetWidth || 1;
            const y = (chip.getBoundingClientRect().top - fr.top) / scale;
            const want = frame.clientHeight * 0.55;
            if (y < 100 || y > frame.clientHeight - 100) frame.scrollTop += y - want;
          }
          placeTip(chip);
        });
      }

      stage.addEventListener('pointerover', (ev) => {
        const chip = tipAnchor(ev.target);
        if (chip && ev.pointerType !== 'touch') placeTip(chip);
      });
      stage.addEventListener('pointerout', (ev) => {
        const chip = tipAnchor(ev.target);
        if (chip && ev.pointerType !== 'touch' && !tipAnchor(ev.relatedTarget))
          hideTips(chip.closest('.device'));
      });
      stage.addEventListener('focusin', (ev) => {
        const chip = tipAnchor(ev.target);
        if (chip) placeTip(chip);
      });
      stage.addEventListener('focusout', (ev) => {
        const chip = tipAnchor(ev.target);
        if (chip) hideTips(chip.closest('.device'));
      });
      /* The bubble is fixed to the frame, not to the rows, so a scroll has to move it
         back onto its chip — or take it away once the chip has left the frame. */
      document.addEventListener('scroll', () => syncTips(), true);
      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') hideTips();
      });

      /* --- interactions: the mockup is clickable so the flow can be judged --- */
      const cartDay = () => {
        let d = vm.cart.find((c) => c.date === vm.activeDate);
        if (!d) {
          d = { date: vm.activeDate, menus: [], extras: [] };
          vm.cart.push(d);
          vm.cart.sort((a, b) => a.date.localeCompare(b.date));
        }
        return d;
      };

      /* A day stays in the cart while it holds a menu *or* an extra; once it holds
         neither it must go, or the summary would charge a delivery fee and warn
         about a minimum for a day nothing was ordered on. */
      const dropDayIfEmpty = (day) => {
        if (!day.menus.length && !(day.extras || []).some((e) => e.qty > 0)) {
          vm.cart = vm.cart.filter((c) => c !== day);
        }
      };

      stage.addEventListener('click', (ev) => {
        /* An allergen chip sits inside the row that opens the composer, so its tap has
           to be taken first: on touch there is no hover, and this is the only way to
           read the name. Tapping anywhere else closes the bubble again. */
        const chip = tipAnchor(ev.target);
        if (chip) {
          placeTip(chip);
          return;
        }
        hideTips();
        if (vm) vm.tip = null;

        const el = ev.target.closest('[data-day],[data-compose],[data-slot],[data-pick],[data-close-overlay],[data-add],[data-remove],[data-extra],[data-toggle],[data-go],[data-open],[data-jump],[data-portions],[data-mealextra],[data-reset],[data-edit]');
        if (!el || !vm) return;
        const d = el.dataset;
        let jumpTo = null;

        if (d.jump !== undefined) {
          // Two device frames render the same view model; scroll the one clicked in.
          vm.activeChip = d.jump;
          render();
          const frame = ev.target.closest('.device');
          const target = d.jump
            ? frame.querySelector('[data-sec="' + d.jump + '"]')
            : frame.querySelector('.chiprail');
          if (target) target.scrollIntoView({ block: 'start' });
          return;
        }
        if (d.reset) {
          vm.composer = composedMenu({});
        } else if (d.edit !== undefined) {
          // Editing pulls the menu back into the form, where it was built.
          const day = vm.cart.find((x) => x.date === vm.activeDate);
          vm.composer = { ...day.menus[Number(d.edit)], portions: 1, extras: {} };
          day.menus.splice(Number(d.edit), 1);
          dropDayIfEmpty(day);
        } else if (d.mealextra) {
          const next = { ...(vm.composer.extras || {}) };
          next[d.mealextra] = Math.max(0, (next[d.mealextra] || 0) + Number(d.delta));
          vm.composer.extras = next;
        } else if (d.portions) {
          vm.composer.portions = Math.max(1, (vm.composer.portions || 1) + Number(d.portions));
        } else if (d.day) {
          vm.activeDate = d.day;
        } else if (d.compose) {
          if (d.compose === 'new') {
            vm.composer = composedMenu({});
          } else {
            const slot = slotOfItem(d.compose);
            vm.composer = { ...vm.composer, [slot]: d.compose };
            if (slot === 'main') {
              vm.composer.variation = null;
              if (!ITEMS[d.compose].requiresSide) vm.composer.side = null;
            }
          }
          jumpTo = 'compose';
        } else if (d.open === 'allergens') {
          vm.overlay = 'allergens';
        } else if (d.pick !== undefined && d.slot) {
          vm.composer[d.slot] = d.pick || null;
          if (vm.overlay === 'picker') vm.overlay = null;
          if (d.slot === 'main') {
            vm.composer.variation = null;
            const picked = d.pick ? ITEMS[d.pick] : null;
            if (!picked || !picked.requiresSide) vm.composer.side = null;
          }
        } else if (d.slot && el.classList.contains('slot-row')) {
          vm.picker = { slot: d.slot };
          vm.overlay = 'picker';
        } else if (d.add) {
          const n = vm.composer.portions || 1;
          const day = cartDay();
          for (let k = 0; k < n; k++) {
            const menu = { ...vm.composer, portions: 1 };
            menu.extras = undefined;
            day.menus.push(menu);
          }
          for (const [key, qty] of Object.entries(vm.composer.extras || {})) {
            if (!qty) continue;
            let e = day.extras.find((x) => x.key === key);
            if (!e) day.extras.push((e = { key, qty: 0 }));
            e.qty += qty * n;
          }
          vm.composer = composedMenu({});
          vm.overlay = null;
        } else if (d.remove !== undefined) {
          const day = vm.cart.find((c) => c.date === vm.activeDate);
          day.menus.splice(Number(d.remove), 1);
          dropDayIfEmpty(day);
        } else if (d.extra) {
          const day = cartDay();
          let e = day.extras.find((x) => x.key === d.extra);
          if (!e) day.extras.push((e = { key: d.extra, qty: 0 }));
          e.qty = Math.max(0, e.qty + Number(d.delta));
          dropDayIfEmpty(day);
        } else if (d.toggle === 'summary') {
          vm.summaryOpen = !vm.summaryOpen;
        } else if (d.go) {
          vm.screen = d.go;
          vm.banners = [];
        } else if (d.closeOverlay !== undefined) {
          vm.overlay = null;
        }
        render();
        if (jumpTo) {
          const target = ev.target.closest('.device').querySelector('[data-sec="' + jumpTo + '"]');
          if (target) target.scrollIntoView({ block: 'start' });
        }
      });

      stateSelect.innerHTML = STATES.map(
        (s) => '<option value="' + s.id + '">' + esc(s.label) + '</option>',
      ).join('');
      stateSelect.addEventListener('change', () => loadState(stateSelect.value));

      document.querySelectorAll('.seg button').forEach((b) =>
        b.addEventListener('click', () => {
          view = b.dataset.view;
          document
            .querySelectorAll('.seg button')
            .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          render();
        }),
      );

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 120);
      });

      document
        .querySelectorAll('.seg button')
        .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));

      loadState(currentId);
    </script>
  </body>
</html>
