# Secrets and variables to create on each GitHub Environment
# (`staging` for develop, `production` for main). No values in this file.
#
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID
# - DATABASE_URL (per environment)
# - WORKER_URL (per environment, the API origin)

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm i --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist/
          if-no-files-found: error

  deploy:
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      WRANGLER_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm i --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Migrate database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check API
        run: curl -f "$WORKER_URL/api/health"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
