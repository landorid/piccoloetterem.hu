# Secrets and variables to create on each GitHub Environment
# (`development` for develop, `production` for main). No values in this file.
#
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID
# - DATABASE_URL (per environment)
# - WORKER_URL (per environment, the API origin)
#
# Variables (not secrets, all three are public) to create on each GitHub Environment. Vite inlines
# them into the admin bundle at build time, so the admin is built in the `deploy` job, where the
# environment's variables are visible:
#
# - VITE_CLERK_PUBLISHABLE_KEY
# - VITE_CLERK_ORG_ID
# - VITE_API_URL (the API origin)

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm i --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error

      # The admin bundle is not uploaded: it is built again in `deploy` with the environment's
      # VITE_* variables, which this job cannot read.

  deploy:
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      # production matches [env.production] in each wrangler.toml.
      # develop deploys the top-level config (piccolo-api, piccolo-web, piccolo-admin).
      WRANGLER_ENV: ${{ github.ref_name == 'main' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm i --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Build admin
        run: pnpm --filter @piccolo/admin build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_ORG_ID: ${{ vars.VITE_CLERK_ORG_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Migrate database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env="$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env="$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --env="$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check API
        run: curl -f "$WORKER_URL/api/health"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
