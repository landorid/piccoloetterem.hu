# Secrets and variables to create on each GitHub Environment
# (`development` for develop, `production` for main). No values in this file.
#
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID
# - DATABASE_URL (per environment)
# - WORKER_URL (per environment, the API origin)
#
# Variables (not secrets, all of them are public) to create on each GitHub Environment. Vite inlines
# them into the admin and web bundles at build time, so both are built in the `deploy` job, where
# the environment's variables are visible:
#
# - VITE_CLERK_PUBLISHABLE_KEY
# - VITE_CLERK_ORG_ID
# - VITE_API_URL (the API origin, for the admin)
# - PUBLIC_API_URL (the API origin, for the web; /megrendeles calls it at build time)
# - VITE_IMAGES_URL, PUBLIC_IMAGES_URL (the dish photos' origin, https://img.<domain>, for each app)

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm i --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
          if-no-files-found: error

      # The admin and web bundles are not uploaded: they are built again in `deploy` with the
      # environment's VITE_* and PUBLIC_* variables, which this job cannot read.

  deploy:
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      # main pushes its release commit and tag, then merges them back into develop.
      contents: write
    env:
      # production matches [env.production] in each wrangler.toml.
      # develop deploys the top-level config (piccolo-api, piccolo-web, piccolo-admin).
      WRANGLER_ENV: ${{ github.ref_name == 'main' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.ref_name == 'main' && 0 || 1 }}

      # Every push to main is a release: bump the minor version (scripts/bump-version.mjs), commit
      # and tag it on main, and deploy that commit. Pushes made with GITHUB_TOKEN start no
      # workflow, so this does not loop. A re-run after the push reuses the release it made.
      - name: Release
        id: release
        if: github.ref_name == 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git fetch --tags origin main
          if [ "$(git rev-parse origin/main^)" = "$GITHUB_SHA" ] && git describe --exact-match --tags --match 'v*' origin/main; then
            git checkout origin/main
          else
            version=$(node scripts/bump-version.mjs)
            git commit -am "Release v$version"
            git tag "v$version"
            git push --atomic origin HEAD:main "v$version"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm i --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist

      - name: Build admin
        run: pnpm --filter @piccolo/admin build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_ORG_ID: ${{ vars.VITE_CLERK_ORG_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_IMAGES_URL: ${{ vars.VITE_IMAGES_URL }}

      - name: Migrate database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env="$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # After the API deploy: /megrendeles calls the API at build time and bakes in its version.
      - name: Build web
        run: pnpm --filter @piccolo/web build
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_IMAGES_URL: ${{ vars.PUBLIC_IMAGES_URL }}

      - name: Deploy web
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env="$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --env="$WRANGLER_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check API
        run: curl -f "$WORKER_URL/api/health"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}

      # Carries the version bump back to develop, so the next release counts on from it.
      - name: Merge the release into develop
        if: github.ref_name == 'main'
        run: |
          git fetch origin develop
          git switch -C develop origin/develop
          git merge --no-edit "${{ steps.release.outputs.sha }}"
          git push origin develop
